<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Carrossel Instagram — modelo</title>

<!--
  ============================================================================
  MODELO DE CARROSSEL PARA INSTAGRAM  (Simple Acc)
  ============================================================================
  Formato 4:5 · frame de 420px · 7 slides · exportável em 1080x1350.

  O QUE EDITAR (e só isso):
    1. O <link> das fontes do Google logo abaixo (se trocar a tipografia).
    2. O objeto BRAND      → cores, nome, @, fontes.
    3. O array SLIDES      → o conteúdo de cada slide.
    4. O objeto LEGENDA    → a legenda do preview do Instagram.

  NÃO MEXA:
    - na largura do .ig-frame (420px). A exportação depende dela.
    - nas funções barraProgresso() e setaSwipe(): elas são geradas sozinhas
      a partir do índice do slide, então nunca ficam fora de sincronia.

  Para exportar os PNGs:  python3 exportar-slides.py carrossel.html slides/
  ============================================================================
-->

<!-- FONTES: troque aqui se mudar o par tipográfico do BRAND (ver sistema-visual.md) -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&family=Playfair+Display:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: #E9E9EB;
    font-family: system-ui, -apple-system, sans-serif;
    display: flex;
    justify-content: center;
    padding: 32px 16px;
  }

  /* ---- Frame do Instagram (só preview — some na exportação) ---- */
  .ig-frame {
    width: 420px;               /* NÃO ALTERAR */
    background: #fff;
    border-radius: 12px;
    box-shadow: 0 4px 24px rgba(0,0,0,.10);
    overflow: hidden;
  }

  .ig-header {
    display: flex; align-items: center; gap: 10px;
    padding: 12px 14px;
    border-bottom: 1px solid #EFEFEF;
  }
  .ig-avatar {
    width: 34px; height: 34px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    color: #fff; font-weight: 700; font-size: 14px; flex-shrink: 0;
  }
  .ig-handle { font-size: 13px; font-weight: 600; color: #111; line-height: 1.3; }
  .ig-sub    { font-size: 11px; color: #8E8E8E; line-height: 1.3; }

  /* ---- Viewport 4:5 ---- */
  .carousel-viewport {
    position: relative;
    width: 100%;
    aspect-ratio: 4 / 5;        /* 420 x 525 */
    overflow: hidden;
    cursor: grab;
    touch-action: pan-y;
    user-select: none;
  }
  .carousel-viewport:active { cursor: grabbing; }

  .carousel-track {
    display: flex;
    height: 100%;
    will-change: transform;
    transition: transform .32s cubic-bezier(.22,.61,.36,1);
  }

  .slide {
    position: relative;
    width: 420px;               /* NÃO ALTERAR */
    height: 100%;
    flex-shrink: 0;
    overflow: hidden;
    display: flex;
    flex-direction: column;
  }

  /* Área de conteúdo de cada slide (o padding-bottom livra a barra) */
  .slide-content {
    position: relative;
    z-index: 2;
    flex: 1;
    display: flex;
    flex-direction: column;
  }

  .serif { font-family: var(--font-heading); }
  .sans  { font-family: var(--font-body); }

  /* ---- Dots / ações / legenda (só preview) ---- */
  .ig-dots {
    display: flex; justify-content: center; align-items: center; gap: 5px;
    padding: 12px 0 6px;
  }
  .ig-dot {
    width: 6px; height: 6px; border-radius: 50%;
    background: #D6D6D6; transition: background .2s;
  }
  .ig-dot.active { background: #3897F0; }

  .ig-actions { display: flex; align-items: center; gap: 14px; padding: 6px 14px 4px; }
  .ig-actions .spacer { flex: 1; }

  .ig-caption { padding: 4px 14px 16px; font-size: 13px; color: #262626; line-height: 1.45; }
  .ig-caption b { font-weight: 600; }
  .ig-time { display: block; margin-top: 8px; font-size: 10px; color: #8E8E8E; letter-spacing: .3px; }
</style>
</head>
<body>

<div class="ig-frame">
  <div class="ig-header">
    <div class="ig-avatar" id="igAvatar"></div>
    <div>
      <div class="ig-handle" id="igHandle"></div>
      <div class="ig-sub" id="igSub"></div>
    </div>
  </div>

  <div class="carousel-viewport" id="viewport">
    <div class="carousel-track" id="track"></div>
  </div>

  <div class="ig-dots" id="dots"></div>

  <div class="ig-actions">
    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#262626" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.7l-1-1.1a5.5 5.5 0 0 0-7.8 7.8l1.1 1.1L12 21.2l7.7-7.7 1.1-1.1a5.5 5.5 0 0 0 0-7.8z"/></svg>
    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#262626" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 11.5a8.4 8.4 0 0 1-9 8.4 8.4 8.4 0 0 1-3.8-.9L3 20.6l1.6-4.9A8.4 8.4 0 0 1 12 3.1a8.4 8.4 0 0 1 9 8.4z"/></svg>
    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#262626" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M22 2 11 13"/><path d="M22 2l-7 20-4-9-9-4 20-7z"/></svg>
    <span class="spacer"></span>
    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#262626" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"/></svg>
  </div>

  <div class="ig-caption" id="igCaption"></div>
</div>

<script>
/* ===========================================================================
   1. MARCA  — o único lugar onde as cores e fontes são definidas
   =========================================================================== */
const BRAND = {
  nome:    'Marca Exemplo',
  handle:  '@marcaexemplo',
  inicial: 'M',                 // usada no lockup quando não há logo

  // Paleta derivada de UMA cor primária (ver references/sistema-visual.md)
  primary:     '#C2703D',       // acento principal: barra, ícones, tags
  light:       '#E3A06B',       // acento secundário: tags no escuro, pills
  dark:        '#6F3C1B',       // texto do CTA, âncora do gradiente
  lightBg:     '#F8F4EF',       // fundo claro (nunca #fff puro)
  lightBorder: '#EBE3D9',       // divisórias no claro
  darkBg:      '#1A1918',       // fundo escuro com tinta da marca

  // Se trocar aqui, troque também o <link> das fontes no <head>
  fontHeading: "'Playfair Display', Georgia, serif",
  fontBody:    "'DM Sans', system-ui, sans-serif",
};

const LEGENDA = {
  texto: 'O carrossel que explica, em 7 telas, por que o seu criativo não vende — e o que fazer.',
  sub:   'Carrossel · 7 telas',
};

/* Gradiente da marca (slides tipo "gradient") */
const GRADIENTE = `linear-gradient(165deg, ${BRAND.dark} 0%, ${BRAND.primary} 50%, ${BRAND.light} 100%)`;

/* Aplica as fontes nas classes .serif / .sans */
document.documentElement.style.setProperty('--font-heading', BRAND.fontHeading);
document.documentElement.style.setProperty('--font-body', BRAND.fontBody);

/* ===========================================================================
   2. COMPONENTES REUTILIZÁVEIS
   =========================================================================== */

/** Rótulo pequeno em caixa alta acima do título. */
function tag(texto, fundo) {
  const cor = fundo === 'light' ? BRAND.primary
            : fundo === 'dark'  ? BRAND.light
            : 'rgba(255,255,255,0.6)';
  return `<span class="sans" style="display:inline-block;font-size:10px;font-weight:600;letter-spacing:2px;color:${cor};margin-bottom:16px;">${texto}</span>`;
}

/** Título do slide. */
function titulo(texto, fundo) {
  const cor = fundo === 'light' ? BRAND.darkBg : '#fff';
  return `<h2 class="serif" style="font-size:31px;font-weight:600;letter-spacing:-0.4px;line-height:1.13;color:${cor};">${texto}</h2>`;
}

/** Parágrafo de apoio. */
function paragrafo(texto, fundo) {
  const cor = fundo === 'light' ? '#6B6560' : 'rgba(255,255,255,0.72)';
  return `<p class="sans" style="font-size:14px;font-weight:400;line-height:1.52;color:${cor};margin-top:14px;">${texto}</p>`;
}

/** Lockup da marca: círculo com a inicial + nome (slides 1 e 7). */
function lockup(fundo) {
  const corTexto = fundo === 'light' ? BRAND.darkBg : '#fff';
  const fundoCirculo = fundo === 'gradient' ? 'rgba(255,255,255,0.18)' : BRAND.primary;
  return `<div style="display:flex;align-items:center;gap:11px;">
    <div style="width:40px;height:40px;border-radius:50%;background:${fundoCirculo};display:flex;align-items:center;justify-content:center;flex-shrink:0;">
      <span class="serif" style="font-size:18px;font-weight:600;color:#fff;">${BRAND.inicial}</span>
    </div>
    <span class="sans" style="font-size:13px;font-weight:600;letter-spacing:0.5px;color:${corTexto};">${BRAND.nome}</span>
  </div>`;
}

/** Pill riscada — "o que está sendo substituído". */
function pillRiscada(texto) {
  return `<span class="sans" style="font-size:11px;padding:5px 12px;border:1px solid rgba(255,255,255,0.1);border-radius:20px;color:#6B6560;text-decoration:line-through;">${texto}</span>`;
}

/** Pill normal — rótulo, opção, categoria. */
function pill(texto) {
  return `<span class="sans" style="font-size:11px;padding:5px 12px;background:rgba(255,255,255,0.06);border-radius:20px;color:${BRAND.light};">${texto}</span>`;
}

/** Caixa de citação / exemplo. */
function caixaCitacao(rotulo, citacao) {
  return `<div style="padding:16px;background:rgba(0,0,0,0.15);border-radius:12px;border:1px solid rgba(255,255,255,0.08);">
    <p class="sans" style="font-size:13px;color:rgba(255,255,255,0.5);margin-bottom:6px;">${rotulo}</p>
    <p class="serif" style="font-size:15px;color:#fff;font-style:italic;line-height:1.4;">"${citacao}"</p>
  </div>`;
}

/** Linha de lista de benefício: ícone + título + descrição. */
function linhaBeneficio(icone, rotulo, descricao) {
  return `<div style="display:flex;align-items:flex-start;gap:14px;padding:10px 0;border-bottom:1px solid ${BRAND.lightBorder};">
    <span style="color:${BRAND.primary};font-size:15px;width:18px;text-align:center;flex-shrink:0;">${icone}</span>
    <div>
      <span class="sans" style="display:block;font-size:14px;font-weight:600;color:${BRAND.darkBg};">${rotulo}</span>
      <span class="sans" style="display:block;font-size:12px;color:#8A8580;margin-top:2px;">${descricao}</span>
    </div>
  </div>`;
}

/** Passo numerado. */
function passo(numero, rotulo, descricao) {
  return `<div style="display:flex;align-items:flex-start;gap:16px;padding:13px 0;border-bottom:1px solid ${BRAND.lightBorder};">
    <span class="serif" style="font-size:26px;font-weight:300;color:${BRAND.primary};min-width:34px;line-height:1;">${numero}</span>
    <div>
      <span class="sans" style="display:block;font-size:14px;font-weight:600;color:${BRAND.darkBg};">${rotulo}</span>
      <span class="sans" style="display:block;font-size:12px;color:#8A8580;margin-top:2px;">${descricao}</span>
    </div>
  </div>`;
}

/** Amostra de cor. */
function amostraCor(cor) {
  return `<div style="width:32px;height:32px;border-radius:8px;background:${cor};border:1px solid rgba(255,255,255,0.08);"></div>`;
}

/** Botão de CTA (só no último slide). */
function botaoCta(texto) {
  return `<div class="sans" style="display:inline-flex;align-items:center;gap:8px;padding:12px 28px;background:${BRAND.lightBg};color:${BRAND.dark};font-weight:600;font-size:14px;border-radius:28px;">${texto}</div>`;
}

/* --- Elementos obrigatórios: gerados automaticamente em todo slide --- */

/** Barra de progresso — preenche conforme o índice do slide. */
function barraProgresso(indice, total, ehClaro) {
  const pct = ((indice + 1) / total) * 100;
  const corTrilho = ehClaro ? 'rgba(0,0,0,0.08)' : 'rgba(255,255,255,0.12)';
  const corPreenchimento = ehClaro ? BRAND.primary : '#fff';
  const corRotulo = ehClaro ? 'rgba(0,0,0,0.3)' : 'rgba(255,255,255,0.4)';
  return `<div style="position:absolute;bottom:0;left:0;right:0;padding:16px 28px 20px;z-index:10;display:flex;align-items:center;gap:10px;">
    <div style="flex:1;height:3px;background:${corTrilho};border-radius:2px;overflow:hidden;">
      <div style="height:100%;width:${pct}%;background:${corPreenchimento};border-radius:2px;"></div>
    </div>
    <span class="sans" style="font-size:11px;color:${corRotulo};font-weight:500;">${indice + 1}/${total}</span>
  </div>`;
}

/** Seta de swipe — em todo slide MENOS no último. */
function setaSwipe(ehClaro) {
  const fundo = ehClaro ? 'rgba(0,0,0,0.06)' : 'rgba(255,255,255,0.08)';
  const traco = ehClaro ? 'rgba(0,0,0,0.25)' : 'rgba(255,255,255,0.35)';
  return `<div style="position:absolute;right:0;top:0;bottom:0;width:48px;z-index:9;display:flex;align-items:center;justify-content:center;background:linear-gradient(to right,transparent,${fundo});">
    <svg width="24" height="24" viewBox="0 0 24 24" fill="none">
      <path d="M9 6l6 6-6 6" stroke="${traco}" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
  </div>`;
}

/* ===========================================================================
   3. OS SLIDES  — é aqui que o conteúdo do carrossel é escrito
   ---------------------------------------------------------------------------
   fundo:  'light' | 'dark' | 'gradient'   (alterne para criar ritmo)
   corpo:  o HTML interno do slide
   Use justify-content:center em capa/CTA e flex-end nos slides de conteúdo.
   O padding-bottom de 52px é obrigatório: livra a barra de progresso.
   =========================================================================== */
const SLIDES = [

  /* 1 — CAPA: o gancho que segura o scroll */
  { fundo: 'light', corpo: `
    <div class="slide-content" style="justify-content:center;padding:0 36px 52px;">
      ${lockup('light')}
      <div style="margin-top:28px;">
        ${tag('CRIATIVOS QUE VENDEM', 'light')}
        ${titulo('Seu criativo não vende porque ele explica.', 'light')}
        ${paragrafo('Explicação informa. Venda acontece quando a pessoa se reconhece no problema antes de você citar a solução.', 'light')}
      </div>
    </div>
  `},

  /* 2 — PROBLEMA: o que está quebrado */
  { fundo: 'dark', corpo: `
    <div class="slide-content" style="justify-content:flex-end;padding:0 36px 52px;">
      ${tag('O ERRO', 'dark')}
      ${titulo('Você está falando do produto cedo demais.', 'dark')}
      ${paragrafo('O feed não é uma reunião: ninguém pediu a sua apresentação. Sem reconhecimento, o resto vira ruído.', 'dark')}
      <div style="display:flex;flex-wrap:wrap;gap:7px;margin-top:18px;">
        ${pillRiscada('Somos líderes')}
        ${pillRiscada('Nossa metodologia')}
        ${pillRiscada('+10 anos no mercado')}
      </div>
    </div>
  `},

  /* 3 — SOLUÇÃO: a virada */
  { fundo: 'gradient', corpo: `
    <div class="slide-content" style="justify-content:flex-end;padding:0 36px 52px;">
      ${tag('A VIRADA', 'gradient')}
      ${titulo('Comece pela frase que ele já diz sozinho.', 'gradient')}
      <div style="margin-top:18px;">
        ${caixaCitacao('O que o cliente pensa antes de comprar:', 'Eu poderia estar faturando o dobro com o que já tenho na mão.')}
      </div>
    </div>
  `},

  /* 4 — O QUE ENTREGA: lista de benefícios */
  { fundo: 'light', corpo: `
    <div class="slide-content" style="justify-content:flex-end;padding:0 36px 52px;">
      ${tag('O QUE MUDA', 'light')}
      ${titulo('Três ajustes, o mesmo orçamento.', 'light')}
      <div style="margin-top:16px;">
        ${linhaBeneficio('◆', 'Gancho de identidade', 'A primeira linha nomeia a pessoa, não o produto.')}
        ${linhaBeneficio('◆', 'Problema reformulado', 'Ele entende a causa que ainda não tinha visto.')}
        ${linhaBeneficio('◆', 'Prova antes da oferta', 'Um caso concreto sustenta o que você promete.')}
      </div>
    </div>
  `},

  /* 5 — PROFUNDIDADE: diferenciais */
  { fundo: 'dark', corpo: `
    <div class="slide-content" style="justify-content:flex-end;padding:0 36px 52px;">
      ${tag('ONDE APLICAR', 'dark')}
      ${titulo('O mesmo ângulo serve o funil inteiro.', 'dark')}
      ${paragrafo('Um ângulo que funciona não morre no anúncio: ele vira assunto de página, de e-mail e de conversa no WhatsApp.', 'dark')}
      <div style="display:flex;flex-wrap:wrap;gap:7px;margin-top:18px;">
        ${pill('Anúncio')}
        ${pill('Carrossel')}
        ${pill('Página')}
        ${pill('Cadência')}
      </div>
    </div>
  `},

  /* 6 — COMO FAZER: passos numerados */
  { fundo: 'light', corpo: `
    <div class="slide-content" style="justify-content:flex-end;padding:0 36px 52px;">
      ${tag('COMO FAZER', 'light')}
      ${titulo('O roteiro em três passos.', 'light')}
      <div style="margin-top:16px;">
        ${passo('01', 'Ouça o cliente', 'Pegue a frase literal de uma call de vendas.')}
        ${passo('02', 'Reformule o problema', 'Mostre a causa por trás do sintoma que ele citou.')}
        ${passo('03', 'Prove e convide', 'Um caso real, um convite direto. Nessa ordem.')}
      </div>
    </div>
  `},

  /* 7 — CTA: sem seta, barra em 100% */
  { fundo: 'gradient', corpo: `
    <div class="slide-content" style="justify-content:center;align-items:center;text-align:center;padding:0 40px 52px;">
      ${lockup('gradient')}
      <div style="margin-top:24px;">
        ${titulo('Qual frase o seu cliente repete?', 'gradient')}
        ${paragrafo('Responde aqui embaixo. Eu leio todas e devolvo o ângulo que eu usaria.', 'gradient')}
      </div>
      <div style="margin-top:26px;">
        ${botaoCta('Comentar agora')}
      </div>
    </div>
  `},
];

/* ===========================================================================
   4. RENDERIZAÇÃO  (não precisa mexer daqui para baixo)
   =========================================================================== */
const TOTAL = SLIDES.length;
const LARGURA = 420;

function fundoCss(fundo) {
  if (fundo === 'light')    return `background:${BRAND.lightBg};`;
  if (fundo === 'dark')     return `background:${BRAND.darkBg};`;
  return `background:${GRADIENTE};`;
}

function renderSlide(slide, i) {
  const ehClaro = slide.fundo === 'light';
  const ehUltimo = i === TOTAL - 1;
  return `<div class="slide" style="${fundoCss(slide.fundo)}">
    ${slide.corpo}
    ${barraProgresso(i, TOTAL, ehClaro)}
    ${ehUltimo ? '' : setaSwipe(ehClaro)}
  </div>`;
}

const track = document.getElementById('track');
track.innerHTML = SLIDES.map(renderSlide).join('');

/* Cabeçalho e legenda do preview */
const avatar = document.getElementById('igAvatar');
avatar.style.background = BRAND.primary;
avatar.textContent = BRAND.inicial;
document.getElementById('igHandle').textContent = BRAND.handle;
document.getElementById('igSub').textContent = LEGENDA.sub;
document.getElementById('igCaption').innerHTML =
  `<b>${BRAND.handle}</b> ${LEGENDA.texto}<span class="ig-time">HÁ 2 HORAS</span>`;

/* Dots */
const dots = document.getElementById('dots');
dots.innerHTML = SLIDES.map((_, i) => `<div class="ig-dot${i === 0 ? ' active' : ''}"></div>`).join('');

/* --- Interação de swipe (só preview; a exportação desliga a transição) --- */
let indice = 0, arrastando = false, xInicial = 0, deltaX = 0;
const viewport = document.getElementById('viewport');

function irPara(i, animar = true) {
  indice = Math.max(0, Math.min(TOTAL - 1, i));
  track.style.transition = animar ? 'transform .32s cubic-bezier(.22,.61,.36,1)' : 'none';
  track.style.transform = `translateX(${-indice * LARGURA}px)`;
  [...dots.children].forEach((d, j) => d.classList.toggle('active', j === indice));
}

viewport.addEventListener('pointerdown', (e) => {
  arrastando = true; xInicial = e.clientX; deltaX = 0;
  viewport.setPointerCapture(e.pointerId);
  track.style.transition = 'none';
});

viewport.addEventListener('pointermove', (e) => {
  if (!arrastando) return;
  deltaX = e.clientX - xInicial;
  track.style.transform = `translateX(${-indice * LARGURA + deltaX}px)`;
});

function soltar() {
  if (!arrastando) return;
  arrastando = false;
  if (Math.abs(deltaX) > LARGURA * 0.18) irPara(indice + (deltaX < 0 ? 1 : -1));
  else irPara(indice);
}
viewport.addEventListener('pointerup', soltar);
viewport.addEventListener('pointercancel', soltar);

/* Setas do teclado ajudam na hora de revisar slide a slide */
window.addEventListener('keydown', (e) => {
  if (e.key === 'ArrowRight') irPara(indice + 1);
  if (e.key === 'ArrowLeft')  irPara(indice - 1);
});

irPara(0, false);
</script>
</body>
</html>
