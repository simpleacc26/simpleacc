<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex" />
  <title>Diagnóstico do Padrão Afetivo · Rafael Cobra</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg" />
  <meta name="description" content="Não é azar, não é dedo podre e não é falta de opção. Descubra em 2 minutos qual padrão se repete nas suas relações e de onde ele vem." />
  <style>
    :root{--bg:#FFFFFF;--text:#17140F}
    body{margin:0;background:var(--bg);color:var(--text);
      font-family:"Montserrat",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif}
  </style>
  <!-- PENDENTE: Pixel da Meta. O ID entra aqui (carrega a biblioteca e dispara
       o PageView) E em app.js > TRACKING_CONFIG (decide os eventos de funil).
       Enquanto os dois estiverem vazios, nada é rastreado e nada quebra. -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <!-- Fontes carregadas sem bloquear a renderização: se o Google Fonts
       demorar ou cair, a página abre na pilha local e nada trava. -->
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700&family=Playfair+Display:wght@600;700&display=swap"
        media="print" onload="this.media='all'" />
  <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700&family=Playfair+Display:wght@600;700&display=swap" /></noscript>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="topbar">
    <div class="container">
      <div class="brand">
        <span class="wordmark">Rafael Cobra</span>
        <span class="brand-tag">Psicanalista</span>
      </div>
    </div>
  </header>

  <!-- Só a barra enchendo. Sem "Pergunta X de N" e sem porcentagem: número
       aqui faz o quiz parecer longo e medido, e derruba conclusão. -->
  <div class="progress-wrap" id="progress" hidden>
    <div class="container">
      <div class="progress-track"><div class="progress-bar" id="progress-bar"></div></div>
    </div>
  </div>

  <main class="container">
    <div id="app" aria-live="polite"></div>
  </main>

  <script src="flow.js" defer></script>
  <script src="app.js" defer></script>
</body>
</html>
