<style>
  @font-face{ font-family:'Playfair Display'; src:url('pf400.woff2') format('woff2'); font-weight:400; font-style:normal; font-display:block;}
  @font-face{ font-family:'Playfair Display'; src:url('pf500.woff2') format('woff2'); font-weight:500; font-style:normal; font-display:block;}
  @font-face{ font-family:'Playfair Display'; src:url('pf600.woff2') format('woff2'); font-weight:600; font-style:normal; font-display:block;}
  @font-face{ font-family:'Playfair Display'; src:url('pf700.woff2') format('woff2'); font-weight:700; font-style:normal; font-display:block;}
  @font-face{ font-family:'Playfair Display'; src:url('pfi500.woff2') format('woff2'); font-weight:500; font-style:italic; font-display:block;}
  @font-face{ font-family:'Lora'; src:url('lora400.woff2') format('woff2'); font-weight:400; font-style:normal; font-display:block;}
  @font-face{ font-family:'Lora'; src:url('lora500.woff2') format('woff2'); font-weight:500; font-style:normal; font-display:block;}
  @font-face{ font-family:'Lora'; src:url('lora600.woff2') format('woff2'); font-weight:600; font-style:normal; font-display:block;}
  @font-face{ font-family:'Lora'; src:url('lora700.woff2') format('woff2'); font-weight:700; font-style:normal; font-display:block;}
  @font-face{ font-family:'Lora'; src:url('lorai400.woff2') format('woff2'); font-weight:400; font-style:italic; font-display:block;}
  :root{
    --ink:#232c39; --soft:#39454f; --steel:#5f7fa6; --steeld:#3f5f86;
    --muted:#95a2b3; --line:#e4e8ee; --callout:#eef2f8; --rose:#fbeeee; --roseb:#c97f7f;
    --navy1:#0c1827; --navy2:#1d3252; --hl:#90a8c6;
  }
  @page{ size: letter; }
  *{ box-sizing:border-box; }
  body{ margin:0; font-family:'Lora', Georgia, serif; color:var(--ink);
        font-size:13px; line-height:1.58; -webkit-font-smoothing:antialiased; }

  .section{ page-break-before: always; }
  .cover{ page-break-before: avoid; }

  .kicker{ font-family:'Liberation Sans', Arial, sans-serif; font-size:8.5px; letter-spacing:3px;
           color:var(--steel); text-transform:uppercase; font-weight:700; margin-bottom:11px; }
  h1.title{ font-family:'Playfair Display', Georgia, serif; font-weight:700; font-size:33px;
            line-height:1.08; color:var(--ink); margin:0 0 17px; letter-spacing:.2px; }
  .lede{ font-size:14px; color:var(--soft); max-width:78%; margin:0 0 22px; }
  h2.sub{ font-family:'Liberation Sans', Arial, sans-serif; font-size:8.5px; letter-spacing:2.6px;
          color:var(--steel); text-transform:uppercase; font-weight:700; margin:26px 0 12px; }

  p{ margin:0 0 12px; }
  .small{ font-size:12px; color:var(--soft); }

  .grid{ display:flex; gap:14px; margin:6px 0 14px; }
  .card{ flex:1; border:1px solid var(--line); border-radius:9px; padding:16px 17px; }
  .card .clab{ font-family:'Liberation Sans', Arial, sans-serif; font-size:7.5px; letter-spacing:2px;
        color:var(--steel); text-transform:uppercase; font-weight:700; margin-bottom:9px; }
  .card .big{ font-family:'Playfair Display', Georgia, serif; font-size:23px; line-height:1.1; color:var(--ink); }
  .card .big small{ font-size:12px; color:var(--muted); }
  .card .ctxt{ font-size:12px; color:var(--soft); margin-top:8px; }

  .quote{ background:linear-gradient(135deg,var(--navy1),var(--navy2)); border-radius:12px;
          padding:27px 31px; margin:14px 0 20px; color:#eaf0f7; }
  .quote p{ font-family:'Playfair Display', Georgia, serif; font-style:italic; font-weight:500;
            font-size:19px; line-height:1.5; margin:0; }
  .quote .hl{ color:var(--hl); }
  .quote .qlab{ font-family:'Liberation Sans', Arial, sans-serif; font-size:8px; letter-spacing:2.5px;
            color:#8ba0bb; text-transform:uppercase; font-weight:700; margin-bottom:12px; }
  .quote .qsub{ font-family:'Lora',serif; font-style:normal; font-size:12.5px; color:#c4d0df;
            margin-top:13px; line-height:1.55; }
  .quote .qmeta{ font-family:'Liberation Sans', Arial, sans-serif; font-size:7.5px; letter-spacing:2px;
            color:#7e93af; text-transform:uppercase; margin-top:12px; }

  .callout{ background:var(--callout); border-left:3px solid var(--steeld); border-radius:0 8px 8px 0;
            padding:15px 19px; margin:16px 0 18px; }
  .callout .clab{ font-family:'Liberation Sans', Arial, sans-serif; font-size:7.5px; letter-spacing:2px;
            color:var(--steeld); text-transform:uppercase; font-weight:700; margin-bottom:7px; }
  .callout p{ margin:0; font-size:12.5px; color:var(--soft); }

  .q{ margin:17px 0 4px; break-inside:avoid; }
  .q .qk{ font-family:'Liberation Sans', Arial, sans-serif; font-size:8px; letter-spacing:2.4px;
          color:var(--steel); text-transform:uppercase; font-weight:700; margin-bottom:6px; }
  .q .qq{ font-family:'Playfair Display', Georgia, serif; font-size:17px; color:var(--ink); margin-bottom:9px; font-weight:600;}
  .opt{ display:flex; gap:12px; padding:7.5px 0; border-top:1px solid var(--line); align-items:baseline; }
  .opt .ol{ font-family:'Liberation Sans', Arial, sans-serif; font-size:8.5px; letter-spacing:1px;
          color:var(--steel); font-weight:700; width:11px; flex:none; }
  .opt .ot{ font-size:12.5px; color:var(--soft); }

  .hero{ background:linear-gradient(135deg,var(--navy1),var(--navy2)); border-radius:12px; padding:25px 29px; margin:6px 0 22px; color:#eaf0f7;}
  .hero .hk{ font-family:'Liberation Sans', Arial, sans-serif; font-size:8px; letter-spacing:2.5px; color:#8ba0bb; text-transform:uppercase; font-weight:700; margin-bottom:12px;}
  .hero .hh{ font-family:'Playfair Display', Georgia, serif; font-size:20px; line-height:1.3; margin:0 0 12px; font-weight:600;}
  .hero .hs{ font-size:12.5px; color:#c4d0df; margin:0;}
  .hero .hm{ font-family:'Liberation Sans', Arial, sans-serif; font-size:7.5px; letter-spacing:2px; color:#7e93af; text-transform:uppercase; margin-top:13px;}

  .mech{ display:flex; gap:16px; padding:13px 0; border-top:1px solid var(--line); break-inside:avoid; }
  .mech .mn{ font-family:'Playfair Display', Georgia, serif; font-size:27px; color:#c4d0dd; font-weight:700; width:40px; flex:none; line-height:1;}
  .mech .mt{ font-family:'Playfair Display', Georgia, serif; font-size:16px; color:var(--ink); font-weight:600; margin-bottom:5px;}
  .mech .md{ font-size:12px; color:var(--soft); margin:0;}

  .twocol{ display:flex; gap:24px; }
  .twocol > div{ flex:1; }
  ul.clean{ list-style:none; padding:0; margin:6px 0; }
  ul.clean li{ font-size:12.5px; color:var(--soft); padding:4.5px 0 4.5px 17px; position:relative; }
  ul.clean li .mk{ position:absolute; left:0; font-weight:700; }
  .yes .mk{ color:#4f8a5e; } .no .mk{ color:#b06a6a; }

  .faq{ break-inside:avoid; margin:0 0 12px; }
  .faq .fq{ font-weight:700; color:var(--ink); font-size:12.5px; }

  .angle{ margin:19px 0; break-inside:avoid; }
  .angle .at{ font-family:'Playfair Display', Georgia, serif; font-size:17px; color:var(--ink); font-weight:600; margin-bottom:4px;}
  .angle .ai{ font-style:italic; color:var(--steel); font-size:12px; margin-bottom:11px;}
  .clab2{ font-family:'Liberation Sans', Arial, sans-serif; font-size:7.5px; letter-spacing:2px; color:var(--steel); text-transform:uppercase; font-weight:700; margin:11px 0 5px;}
  .hookbox{ background:linear-gradient(135deg,var(--navy1),var(--navy2)); border-radius:9px; padding:15px 19px; margin:4px 0 11px;}
  .hookbox p{ font-family:'Playfair Display', Georgia, serif; font-style:italic; font-size:14px; color:#eaf0f7; margin:0;}

  ol.num{ margin:6px 0; padding-left:21px; }
  ol.num li{ font-size:12.5px; color:var(--soft); padding:4.5px 0; }
  ol.num.it li{ font-style:italic; }

  .step{ display:flex; gap:16px; padding:9px 0; border-top:1px solid var(--line); break-inside:avoid;}
  .step .sn{ font-family:'Playfair Display', Georgia, serif; font-size:19px; color:var(--steel); font-weight:600; width:25px; flex:none; line-height:1.2;}
  .step .st{ font-family:'Playfair Display', Georgia, serif; font-size:15px; color:var(--ink); font-weight:600; margin-bottom:5px;}
  .step .sd{ font-size:12px; color:var(--soft); margin:0;}
  .v{ color:var(--steeld); font-weight:700; }

  .day{ display:flex; gap:18px; padding:11px 0; border-top:1px solid var(--line); break-inside:avoid;}
  .day .dn{ width:90px; flex:none;}
  .day .dd{ font-family:'Playfair Display', Georgia, serif; font-size:18px; color:var(--ink); font-weight:600; line-height:1;}
  .day .dl{ font-family:'Liberation Sans', Arial, sans-serif; font-size:7px; letter-spacing:1.6px; color:var(--steel); text-transform:uppercase; margin-top:5px;}
  .day .dt{ font-size:12.5px; color:var(--soft); margin:0;}
  .day.key .dt{ background:var(--callout); border-radius:7px; padding:11px 14px;}

  .divider{ height:1px; background:var(--line); margin:22px 0; border:none; }
</style>
