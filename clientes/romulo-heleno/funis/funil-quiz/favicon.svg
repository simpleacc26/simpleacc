<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="Rômulo Heleno">
  <title>Rômulo Heleno</title>
  <!-- Mesmo monograma do logo.svg, sobre o navy institucional, que é o que
       sobrevive na aba do navegador. O traço é o MESMO arquivo do logo.svg,
       byte a byte: em vez de uma segunda cópia do monograma já em marfim, o
       navy é repintado aqui pelo filtro abaixo. Uma cópia só do desenho quer
       dizer um lugar só para errar, e o deploy reaproveita string conferida.
       Nos 16px os traços finos somem: é limitação do desenho, não do arquivo. -->
  <defs>
    <filter id="marfim" color-interpolation-filters="sRGB">
      <feColorMatrix type="matrix" values="0 0 0 0 0.9608
                                           0 0 0 0 0.9451
                                           0 0 0 0 0.9176
                                           0 0 0 1 0"/>
    </filter>
  </defs>
  <rect width="64" height="64" rx="14" fill="#14233D"/>
  <image x="9" y="9" width="46" height="46" filter="url(#marfim)" xlink:href="data:image/png;base64,"/>
</svg>
