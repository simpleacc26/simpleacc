<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Carrossel Vitória Daniela — Sessão gratuita</title>

<!--
  CARROSSEL 4 CARDS · VITÓRIA DANIELA · preto e dourado
  Tema: por que sessão gratuita é o pior funil para vender serviço caro.
  Estrutura modelada na referência (gancho de opinião, analogia do mundo real,
  princípio, CTA), revozeada nas Diretrizes de Escrita da Vitória.
  Exportar: python3 exportar-slides.py carrossel.html slides/
-->

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&family=Playfair+Display:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background:#E9E9EB; font-family:system-ui,-apple-system,sans-serif; display:flex; justify-content:center; padding:32px 16px; }

  .ig-frame { width:420px; background:#fff; border-radius:12px; box-shadow:0 4px 24px rgba(0,0,0,.10); overflow:hidden; }
  .ig-header { display:flex; align-items:center; gap:10px; padding:12px 14px; border-bottom:1px solid #EFEFEF; }
  .ig-avatar { width:34px; height:34px; border-radius:50%; display:flex; align-items:center; justify-content:center; color:#C9A24C; font-weight:700; font-size:15px; flex-shrink:0; font-family:'Playfair Display',serif; }
  .ig-handle { font-size:13px; font-weight:600; color:#111; line-height:1.3; }
  .ig-sub { font-size:11px; color:#8E8E8E; line-height:1.3; }

  .carousel-viewport { position:relative; width:100%; aspect-ratio:4/5; overflow:hidden; cursor:grab; touch-action:pan-y; user-select:none; }
  .carousel-viewport:active { cursor:grabbing; }
  .carousel-track { display:flex; height:100%; will-change:transform; transition:transform .32s cubic-bezier(.22,.61,.36,1); }
  .slide { position:relative; width:420px; height:100%; flex-shrink:0; overflow:hidden; display:flex; flex-direction:column; }
  .slide-content { position:relative; z-index:2; flex:1; display:flex; flex-direction:column; }

  .serif { font-family:'Playfair Display', Georgia, serif; }
  .sans  { font-family:'DM Sans', system-ui, sans-serif; }

  .ig-dots { display:flex; justify-content:center; align-items:center; gap:5px; padding:12px 0 6px; }
  .ig-dot { width:6px; height:6px; border-radius:50%; background:#D6D6D6; transition:background .2s; }
  .ig-dot.active { background:#C9A24C; }
  .ig-actions { display:flex; align-items:center; gap:14px; padding:6px 14px 4px; }
  .ig-actions .spacer { flex:1; }
  .ig-caption { padding:4px 14px 16px; font-size:13px; color:#262626; line-height:1.45; }
  .ig-caption b { font-weight:600; }
  .ig-time { display:block; margin-top:8px; font-size:10px; color:#8E8E8E; letter-spacing:.3px; }
</style>
</head>
<body>

<div class="ig-frame">
  <div class="ig-header">
    <div class="ig-avatar" id="igAvatar"></div>
    <div>
      <div class="ig-handle" id="igHandle"></div>
      <div class="ig-sub" id="igSub"></div>
    </div>
  </div>

  <div class="carousel-viewport" id="viewport">
    <div class="carousel-track" id="track"></div>
  </div>

  <div class="ig-dots" id="dots"></div>

  <div class="ig-actions">
    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#262626" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.7l-1-1.1a5.5 5.5 0 0 0-7.8 7.8l1.1 1.1L12 21.2l7.7-7.7 1.1-1.1a5.5 5.5 0 0 0 0-7.8z"/></svg>
    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#262626" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 11.5a8.4 8.4 0 0 1-9 8.4 8.4 8.4 0 0 1-3.8-.9L3 20.6l1.6-4.9A8.4 8.4 0 0 1 12 3.1a8.4 8.4 0 0 1 9 8.4z"/></svg>
    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#262626" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M22 2 11 13"/><path d="M22 2l-7 20-4-9-9-4 20-7z"/></svg>
    <span class="spacer"></span>
    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#262626" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"/></svg>
  </div>

  <div class="ig-caption" id="igCaption"></div>
</div>

<script>
/* ====================== MARCA: preto e dourado ====================== */
const BRAND = {
  nome:    'VITÓRIA DANIELA',
  handle:  '@vitoriadaniela',      // CONFIRMAR o @ real (não aparece nos PNGs, só no preview)
  inicial: 'V',

  primary:     '#C9A24C',   // dourado
  light:       '#E6C87F',   // dourado claro
  dark:        '#7A5E1E',   // dourado escuro
  lightBg:     '#F4F0E6',   // creme quente
  lightBorder: '#E2DAC8',
  darkBg:      '#0E0D0B',   // preto quente
  tintaEscura: '#2A2007',   // texto sobre o dourado
};

const LEGENDA = {
  sub:   'Carrossel · 4 cards',
  texto: 'Sessão gratuita não filtra, convoca. E depois a culpa cai no comercial.',
};

const GRADIENTE = `linear-gradient(165deg, ${BRAND.dark} 0%, ${BRAND.primary} 52%, ${BRAND.light} 100%)`;

/* ====================== COMPONENTES ====================== */

function tag(texto, fundo) {
  const cor = fundo === 'light' ? BRAND.dark
            : fundo === 'dark'  ? BRAND.primary
            : 'rgba(42,32,7,0.62)';
  return `<span class="sans" style="display:inline-block;font-size:10px;font-weight:600;letter-spacing:2.4px;color:${cor};margin-bottom:18px;">${texto}</span>`;
}

function titulo(texto, fundo, tamanho) {
  const cor = fundo === 'light' ? BRAND.darkBg
            : fundo === 'dark'  ? '#F7F4EC'
            : BRAND.tintaEscura;
  return `<h2 class="serif" style="font-size:${tamanho || 32}px;font-weight:600;letter-spacing:-0.4px;line-height:1.14;color:${cor};">${texto}</h2>`;
}

function paragrafo(texto, fundo) {
  const cor = fundo === 'light' ? '#6A6152'
            : fundo === 'dark'  ? 'rgba(247,244,236,0.66)'
            : 'rgba(42,32,7,0.78)';
  return `<p class="sans" style="font-size:14px;font-weight:400;line-height:1.54;color:${cor};margin-top:16px;">${texto}</p>`;
}

/** Lockup da marca. */
function lockup(fundo) {
  const corTexto  = fundo === 'light' ? BRAND.darkBg : fundo === 'dark' ? '#F7F4EC' : BRAND.tintaEscura;
  const fundoCirc = fundo === 'gradient' ? BRAND.darkBg : BRAND.primary;
  const corInic   = fundo === 'gradient' ? BRAND.primary : BRAND.darkBg;
  return `<div style="display:flex;align-items:center;gap:11px;">
    <div style="width:38px;height:38px;border-radius:50%;background:${fundoCirc};display:flex;align-items:center;justify-content:center;flex-shrink:0;">
      <span class="serif" style="font-size:18px;font-weight:600;color:${corInic};">${BRAND.inicial}</span>
    </div>
    <span class="sans" style="font-size:11px;font-weight:600;letter-spacing:2.2px;color:${corTexto};">${BRAND.nome}</span>
  </div>`;
}

/** Filete dourado, usado como respiro entre gancho e desenvolvimento. */
function filete(fundo) {
  const cor = fundo === 'gradient' ? 'rgba(42,32,7,0.28)' : BRAND.primary;
  return `<div style="width:44px;height:2px;background:${cor};margin:20px 0 0;"></div>`;
}

function botaoCta(texto) {
  return `<div class="sans" style="display:inline-flex;align-items:center;gap:8px;padding:13px 26px;background:${BRAND.darkBg};color:${BRAND.primary};font-weight:600;font-size:13.5px;border-radius:28px;letter-spacing:.2px;">${texto}</div>`;
}

/* --- Elementos obrigatórios --- */

function barraProgresso(indice, total, fundo) {
  const pct = ((indice + 1) / total) * 100;
  let corTrilho, corPreench, corRotulo;
  if (fundo === 'light')        { corTrilho='rgba(0,0,0,0.08)';        corPreench=BRAND.primary; corRotulo='rgba(0,0,0,0.32)'; }
  else if (fundo === 'dark')    { corTrilho='rgba(255,255,255,0.12)';  corPreench=BRAND.primary; corRotulo='rgba(255,255,255,0.42)'; }
  else                          { corTrilho='rgba(42,32,7,0.18)';      corPreench=BRAND.darkBg;  corRotulo='rgba(42,32,7,0.5)'; }
  return `<div style="position:absolute;bottom:0;left:0;right:0;padding:16px 28px 20px;z-index:10;display:flex;align-items:center;gap:10px;">
    <div style="flex:1;height:3px;background:${corTrilho};border-radius:2px;overflow:hidden;">
      <div style="height:100%;width:${pct}%;background:${corPreench};border-radius:2px;"></div>
    </div>
    <span class="sans" style="font-size:11px;color:${corRotulo};font-weight:500;">${indice + 1}/${total}</span>
  </div>`;
}

function setaSwipe(fundo) {
  const bg    = fundo === 'light' ? 'rgba(0,0,0,0.05)' : fundo === 'dark' ? 'rgba(201,162,76,0.12)' : 'rgba(42,32,7,0.08)';
  const traco = fundo === 'light' ? 'rgba(0,0,0,0.25)' : fundo === 'dark' ? 'rgba(201,162,76,0.75)' : 'rgba(42,32,7,0.4)';
  return `<div style="position:absolute;right:0;top:0;bottom:0;width:48px;z-index:9;display:flex;align-items:center;justify-content:center;background:linear-gradient(to right,transparent,${bg});">
    <svg width="24" height="24" viewBox="0 0 24 24" fill="none">
      <path d="M9 6l6 6-6 6" stroke="${traco}" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
  </div>`;
}

/* ====================== OS 4 CARDS ====================== */
const SLIDES = [

  /* 1 — GANCHO: opinião polêmica. Sem ele os outros não existem. */
  { fundo: 'dark', corpo: `
    <div class="slide-content" style="justify-content:space-between;padding:36px 36px 62px;">
      ${lockup('dark')}
      <div>
        ${tag('AQUISIÇÃO', 'dark')}
        ${titulo('Sessão gratuita é o pior jeito de vender serviço caro.', 'dark', 33)}
        ${filete('dark')}
        ${paragrafo('E o problema não é o preço da sessão. É o que o gratuito diz sobre você antes de você abrir a boca.', 'dark')}
      </div>
    </div>
  `},

  /* 2 — ANALOGIA do mundo real (negócio e dinheiro, como a Diretriz manda). */
  { fundo: 'light', corpo: `
    <div class="slide-content" style="justify-content:flex-end;padding:0 36px 62px;">
      ${tag('PENSA COMIGO', 'light')}
      ${titulo('Uma loja de doces dá degustação. E vende um doce de 20 reais.', 'light', 30)}
      ${paragrafo('Agora imagine um restaurante premium parando gente na calçada com prato de graça.', 'light')}
      <p class="serif" style="font-size:17px;line-height:1.35;color:${BRAND.dark};font-style:italic;margin-top:18px;">Ninguém desconfia da degustação. Todo mundo desconfia do banquete.</p>
    </div>
  `},

  /* 3 — CONFRONTO: o diagnóstico, construído junto e sem colo. */
  { fundo: 'dark', corpo: `
    <div class="slide-content" style="justify-content:flex-end;padding:0 36px 62px;">
      ${tag('O QUE ACONTECE', 'dark')}
      ${titulo('Grátis não filtra. Grátis convoca.', 'dark', 34)}
      ${filete('dark')}
      ${paragrafo('Sua agenda enche de gente que gostou de conversar, não de gente que decidiu resolver.', 'dark')}
      ${paragrafo('Aí a culpa cai no comercial, no tráfego, no algoritmo. Mas ela começou no anúncio.', 'dark')}
    </div>
  `},

  /* 4 — VIRADA + CTA lógica. Sem seta, barra em 100%. */
  { fundo: 'gradient', corpo: `
    <div class="slide-content" style="justify-content:space-between;padding:36px 36px 62px;">
      ${lockup('gradient')}
      <div>
        ${tag('A VIRADA', 'gradient')}
        ${titulo('O que qualifica não é o preço. É o esforço de entrada.', 'gradient', 30)}
        ${paragrafo('Quem preenche um formulário, escreve sobre o próprio negócio e espera retorno já decidiu que quer resolver. Quem clica em "agenda grátis" ainda está passeando.', 'gradient')}
        <div style="margin-top:24px;">
          ${botaoCta('Deixei o link nos comentários')}
        </div>
      </div>
    </div>
  `},
];

/* ====================== RENDER ====================== */
const TOTAL = SLIDES.length;
const LARGURA = 420;

function fundoCss(fundo) {
  if (fundo === 'light') return `background:${BRAND.lightBg};`;
  if (fundo === 'dark')  return `background:${BRAND.darkBg};`;
  return `background:${GRADIENTE};`;
}

function renderSlide(slide, i) {
  const ehUltimo = i === TOTAL - 1;
  return `<div class="slide" style="${fundoCss(slide.fundo)}">
    ${slide.corpo}
    ${barraProgresso(i, TOTAL, slide.fundo)}
    ${ehUltimo ? '' : setaSwipe(slide.fundo)}
  </div>`;
}

const track = document.getElementById('track');
track.innerHTML = SLIDES.map(renderSlide).join('');

const avatar = document.getElementById('igAvatar');
avatar.style.background = BRAND.darkBg;
avatar.textContent = BRAND.inicial;
document.getElementById('igHandle').textContent = BRAND.handle;
document.getElementById('igSub').textContent = LEGENDA.sub;
document.getElementById('igCaption').innerHTML =
  `<b>${BRAND.handle}</b> ${LEGENDA.texto}<span class="ig-time">HÁ 2 HORAS</span>`;

const dots = document.getElementById('dots');
dots.innerHTML = SLIDES.map((_, i) => `<div class="ig-dot${i === 0 ? ' active' : ''}"></div>`).join('');

let indice = 0, arrastando = false, xInicial = 0, deltaX = 0;
const viewport = document.getElementById('viewport');

function irPara(i, animar = true) {
  indice = Math.max(0, Math.min(TOTAL - 1, i));
  track.style.transition = animar ? 'transform .32s cubic-bezier(.22,.61,.36,1)' : 'none';
  track.style.transform = `translateX(${-indice * LARGURA}px)`;
  [...dots.children].forEach((d, j) => d.classList.toggle('active', j === indice));
}

viewport.addEventListener('pointerdown', (e) => {
  arrastando = true; xInicial = e.clientX; deltaX = 0;
  viewport.setPointerCapture(e.pointerId);
  track.style.transition = 'none';
});
viewport.addEventListener('pointermove', (e) => {
  if (!arrastando) return;
  deltaX = e.clientX - xInicial;
  track.style.transform = `translateX(${-indice * LARGURA + deltaX}px)`;
});
function soltar() {
  if (!arrastando) return;
  arrastando = false;
  if (Math.abs(deltaX) > LARGURA * 0.18) irPara(indice + (deltaX < 0 ? 1 : -1));
  else irPara(indice);
}
viewport.addEventListener('pointerup', soltar);
viewport.addEventListener('pointercancel', soltar);
window.addEventListener('keydown', (e) => {
  if (e.key === 'ArrowRight') irPara(indice + 1);
  if (e.key === 'ArrowLeft')  irPara(indice - 1);
});

irPara(0, false);
</script>
</body>
</html>
