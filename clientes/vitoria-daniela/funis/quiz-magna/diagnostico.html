<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Seu diagnóstico · Vitória Daniela</title>
  <style>
    :root{--bg:#0B0A08;--text:#F5EFE4}
    body{margin:0;background:var(--bg);color:var(--text);
      font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif}
  </style>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="topbar">
    <div class="container">
      <div class="brand">
        <span class="brand-name">Vitória Daniela</span>
        <span class="brand-tag">Grupo Magna</span>
      </div>
    </div>
  </header>

  <main class="container">
    <div class="toolbar no-print">
      <button class="btn btn-primary" id="whatsapp">Falar com a equipe no WhatsApp</button>
      <button class="btn btn-ghost" id="pdf">Baixar PDF</button>
    </div>
    <div class="card screen" id="report"><!-- preenchido por diagnostico.js --></div>
  </main>

  <p class="foot">Diagnóstico elaborado pela equipe da Vitória Daniela · Grupo Magna · uso pessoal</p>

  <script src="flow.js" defer></script>
  <script src="diagnostico.js" defer></script>
</body>
</html>
