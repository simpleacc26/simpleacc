    width:100%; background:var(--branco); color:var(--tinta);
    border:1px solid var(--linha); border-radius:3px;

  .campo input::placeholder{color:var(--tinta-3); font-weight:300}
  .campo input:focus{outline:0; border-color:var(--ouro)}
  .campo .aviso{

    .ficha{padding:.3rem 1.2rem}
  }
  @media (prefers-reduced-motion:reduce){
    *{animation:none !important; transition:none !important}
  }
</style>

const passo = document.getElementById('passo');
const pad = n => String(n).padStart(2,'0');
const esc = s => String(s==null?'':s).replace(/[<>&]/g, c => ({'<':'&lt;','>':'&gt;','&':'&amp;'}[c]));
const LETRA = 'ABCDEFG';

function cabecalho(){
  const dentro = etapa >= 1 && etapa <= TOTAL;
  fill.style.width = (dentro ? ((etapa-1)/TOTAL)*100 : (etapa > TOTAL ? 100 : 0)) + '%';
  passo.innerHTML = dentro ? `<b>${pad(etapa)}</b> / ${pad(TOTAL)}` : '';
}

function pintar(html){
  tela.innerHTML = html;
  tela.style.animation = 'none'; void tela.offsetWidth; tela.style.animation = '';
  cabecalho();
  window.scrollTo({ top:0, behavior:'smooth' });
}

/* ── 00 · abertura, promessa e subheadline ────────────── */
function abertura(){
  pintar(`
    <div class="abre">
      <p class="selo">Diagnóstico para donas de clínica e consultório de estética avançada</p>
      <h1>A sua clínica entrega o seu nome pelas <em>mãos de outras pessoas</em></h1>
      <p class="sub">
        Em algum momento você deixou de estar em todas as salas, e junto foi embora a
        certeza de que o que sai de cada uma delas é o que o seu nome promete.
        <strong>Existem quatro pontos onde a clínica de estética avançada trava exatamente
        nesse estágio.</strong> Seis perguntas e eu te digo qual é o seu.
      </p>

      <dl class="ficha">
        <div><dt>Perguntas</dt><dd>Seis</dd></div>
        <div><dt>Tempo</dt><dd>Menos de 2 minutos</dd></div>
        <div><dt>Quem analisa</dt><dd>Juliana Godinho</dd></div>
        <div><dt>Resultado</dt><dd>Na tela, ao terminar</dd></div>
      </dl>

      <div class="rodape-btn">
        <button class="btn" id="ir">Começar o diagnóstico <i>&rarr;</i></button>
        <span class="dica">Sem cadastro para começar</span>
      </div>
    </div>`);
  document.getElementById('ir').onclick = () => { etapa = 1; render(); dl('quiz_inicio'); };
}

/* ── perguntas ────────────────────────────────────────── */
function pergunta(){
  const P = PERGUNTAS[etapa-1];
  const multipla = P.tipo === 'multipla';
  const marcadas = multipla ? (R[P.id] || []) : null;

  pintar(`
    <p class="indice">Pergunta ${pad(etapa)} de ${pad(TOTAL)}</p>
    <h2>${P.texto}</h2>
    ${P.apoio ? `<p class="apoio">${esc(P.apoio)}</p>` : ''}
    <div class="opcoes" role="group">
      ${P.opts.map((o,i) => `
        <button class="opt" data-i="${i}" ${multipla ? `aria-pressed="${marcadas.indexOf(i)>=0}"` : ''}>
          <span class="ch">${LETRA[i]}</span><span class="tx">${esc(o.t)}</span>
        </button>`).join('')}
    </div>
    ${multipla ? `
      <div class="rodape-btn" style="margin-top:2rem">
        <button class="btn" id="seguir" ${marcadas.length ? '' : 'disabled'}>Continuar <i>&rarr;</i></button>
        <span class="dica">Pode marcar mais de uma</span>
      </div>` : ''}
  `);

  tela.querySelectorAll('.opt').forEach(b => {
    b.onclick = () => {
      const i = +b.dataset.i;
      if(multipla){
        const lista = R[P.id] || (R[P.id] = []);
        const pos = lista.indexOf(i);
        if(pos >= 0) lista.splice(pos,1); else lista.push(i);
        b.setAttribute('aria-pressed', pos < 0);
        document.getElementById('seguir').disabled = !lista.length;
        return;
      }
      R[P.id] = i;
      dl('quiz_resposta', { quiz_pergunta: P.id, quiz_opcao: P.opts[i].t });
      if(P.opts[i].fora){ fora = true; return encerrar(); }
      etapa++; render();
    };
  });

  const seguir = document.getElementById('seguir');
  if(seguir) seguir.onclick = () => {
    dl('quiz_resposta', { quiz_pergunta: P.id, quiz_opcao: (R[P.id]||[]).map(k => P.opts[k].t).join(' + ') });
    etapa++; render();
  };
}

/* ── encerramento de quem está fora do escopo ─────────── */
function encerrar(){
  etapa = TOTAL + 1;
  pintar(`
    <div class="fora">
      <p class="indice">Diagnóstico encerrado</p>
      <h2>O que eu faço não serve para o seu caso</h2>
      <p>
        Eu trabalho a estrutura de clínica e consultório de estética avançada, e aplicar
        isso a outro modelo de negócio não geraria resultado para você. Prefiro te dizer
        agora do que ocupar o seu tempo.
      </p>
      <p>Obrigada por responder até aqui.</p>
    </div>`);
  enviar(WEBHOOK_FORA, { motivo:'fora de escopo na P1', funil:FUNIL, utm:UTM, em:new Date().toISOString() });
  dl('quiz_desqualificado', { quiz_motivo:'fora de escopo na P1' });
}

/* ── captura ──────────────────────────────────────────── */
function captura(){
  etapa = TOTAL + 1;
  pintar(`
    <p class="indice">Última etapa</p>
    <h2>Para onde eu envio a sua análise</h2>
    <p class="apoio">O resultado aparece na tela agora. O número é para o caso de você querer conversar sobre ele depois.</p>

    <form class="campos" id="form" novalidate>
      <div class="campo" id="c-nome">
        <label for="nome">Seu nome</label>
        <input id="nome" name="nome" type="text" autocomplete="name" placeholder="Como você prefere ser chamada">
        <span class="aviso">Preciso do seu nome</span>
      </div>
      <div class="campo" id="c-fone">
        <label for="fone">WhatsApp com DDD</label>
        <input id="fone" name="fone" type="tel" inputmode="numeric" autocomplete="tel" placeholder="(00) 00000-0000">
        <span class="aviso">Confira o número, faltam dígitos</span>
      </div>
      <div class="campo" id="c-mail">
        <label for="mail">E-mail</label>
        <input id="mail" name="mail" type="email" autocomplete="email" placeholder="voce@suaclinica.com.br">
        <span class="aviso">Confira o e-mail</span>
      </div>
    </form>

    <div class="rodape-btn">
      <button class="btn" id="ver">Ver o meu diagnóstico <i>&rarr;</i></button>
    </div>
    <p class="privacidade">
      Os seus dados ficam comigo e com o meu time, e servem só para falar com você
      sobre o resultado deste diagnóstico.
    </p>`);

  const fone = document.getElementById('fone');
  fone.addEventListener('input', () => {
    let v = fone.value.replace(/\D/g,'').slice(0,11);
    fone.value = v.length > 10 ? `(${v.slice(0,2)}) ${v.slice(2,7)}-${v.slice(7)}`
              : v.length > 6  ? `(${v.slice(0,2)}) ${v.slice(2,6)}-${v.slice(6)}`
              : v.length > 2  ? `(${v.slice(0,2)}) ${v.slice(2)}` : v;
  });

  document.getElementById('ver').onclick = () => {
    const nome = document.getElementById('nome').value.trim();
    const digitos = fone.value.replace(/\D/g,'');
    const mail = document.getElementById('mail').value.trim();
    let ok = true;
    const marcar = (id, bom) => { document.getElementById(id).classList.toggle('ruim', !bom); if(!bom) ok = false; };
    marcar('c-nome', nome.length >= 2);
    marcar('c-fone', digitos.length >= 10);
    marcar('c-mail', /^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(mail));
    if(!ok) return;
    R._nome = nome; R._fone = digitos; R._mail = mail;
    concluir();
  };
}

/* ── conclusão ────────────────────────────────────────── */
function frase(id){
  const P = PERGUNTAS.find(p => p.id === id);
  const v = R[id];
  return Array.isArray(v) ? v.map(i => P.opts[i].r).join(' ') : (P.opts[v] || {}).r || '';
}

function concluir(){
  const qKey = PERGUNTAS[1].opts[R.cena].q;
  const Q = QUADROS[qKey];
  const rota = PERGUNTAS[5].opts[R.faturamento].rota;
  const P = PILAR_DO_QUADRO[qKey];

  const leadId = (() => {
    try{ if(crypto && crypto.randomUUID) return crypto.randomUUID(); }catch(e){}
    return 'l-' + Date.now().toString(36) + '-' + Math.random().toString(36).slice(2,10);
  })();

  const payload = {
    id: leadId, funil: FUNIL,
    nome:R._nome, fone:R._fone, mail:R._mail,
    quadroId:qKey, quadro:Q.nome, porque:Q.porque, caminho:Q.caminho, rota:rota,
    cenario:`Você tem uma clínica ou consultório ${frase('carro')}. ${frase('equipe')} ${frase('margem')}`,
    tentativas: frase('tentou'),
    pilares: PILARES, pilarIdx:P.i, pilarNome:PILARES[P.i].n, pilarPor:P.por,
    utm: UTM,
    debug: [
      'carro-chefe: '+PERGUNTAS[0].opts[R.carro].t,
      'quem entrega: '+PERGUNTAS[2].opts[R.equipe].t,
      'margem: '+PERGUNTAS[3].opts[R.margem].t,
      'já tentou: '+((R.tentou||[]).map(k=>PERGUNTAS[4].opts[k].t).join(' + ')||'nada'),
      'faturamento: '+PERGUNTAS[5].opts[R.faturamento].t
    ],
    em: new Date().toISOString()
  };
  try{ sessionStorage.setItem('jugodinho_quizb', JSON.stringify(payload)); }catch(e){}

  enviar(WEBHOOK, {
    lead_id: leadId, funil: FUNIL,
    nome: R._nome, numero: R._fone, email: R._mail,
    q1: PERGUNTAS[0].opts[R.carro].t,
    q2: PERGUNTAS[1].opts[R.cena].t,
    q3: PERGUNTAS[2].opts[R.equipe].t,
    q4: PERGUNTAS[3].opts[R.margem].t,
    q5: (R.tentou||[]).map(k=>PERGUNTAS[4].opts[k].t).join(' + '),
    q6: PERGUNTAS[5].opts[R.faturamento].t,
    gargalo: Q.nome, rota: rota,
    utm_source: UTM.utm_source || '', utm_medium: UTM.utm_medium || '',
    utm_campaign: UTM.utm_campaign || '', utm_content: UTM.utm_content || '',
    utm_term: UTM.utm_term || '',
    em: payload.em
  });

  dl('quiz_completo_captura', {
    lead_id: leadId, quiz_quadro: qKey, quiz_rota: rota,
    quiz_faturamento: PERGUNTAS[5].opts[R.faturamento].t
  });

  pintar(`
    <p class="indice">Analisando as suas respostas</p>
    <h2>Um instante</h2>
    <div class="espera" style="margin-top:1.6rem"><i></i><span>Montando o seu diagnóstico</span></div>`);

  setTimeout(() => { location.href = 'diagnostico.html'; }, 1400);
}

/* ── roteador ─────────────────────────────────────────── */
function render(){
  if(fora) return;
  if(etapa === 0) return abertura();
  if(etapa <= TOTAL) return pergunta();
  return captura();
}

render();
</script>

</body>
</html>
