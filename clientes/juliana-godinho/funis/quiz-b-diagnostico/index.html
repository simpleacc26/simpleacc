<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Diagnóstico · Juliana Godinho</title>
<meta name="description" content="Descubra qual gargalo está travando o crescimento da sua clínica ou consultório de estética avançada.">
<meta name="robots" content="noindex,nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#F4F2ED;
    --card:#FFFFFF;
    --espresso:#171412;
    --ink:#141210;
    --ink-2:#4C4640;
    --ink-3:#8C8279;
    --line:#E4DFD6;
    --line-2:#D6CFC2;

    --gold:#C9A84C;
    --gold-deep:#A2802F;
    --gold-tint:#FBF4E0;
    --gold-hair:rgba(201,168,76,.32);

    --ment:#7A6224;
    --edp:#8C7A52;
    --fora:#8A5B4E;

    --serif:"Cormorant Garamond",Georgia,"Times New Roman",serif;
    --sans:"Inter",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
    --wrap:min(100% - 2.5rem, 42rem);
    --r:4px;
  }
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
  html{background:var(--bg)}
  body{
    background:var(--bg); color:var(--ink); font-family:var(--sans);
    font-size:17px; line-height:1.6; -webkit-font-smoothing:antialiased;
    min-height:100vh; display:flex; flex-direction:column;
  }
  .wrap{width:var(--wrap); margin-inline:auto}

  /* —— chrome —— */
  .bar{background:var(--espresso); border-bottom:1px solid rgba(201,168,76,.22)}
  .bar .wrap{
    display:flex; align-items:center; justify-content:space-between;
    gap:1rem; padding:1.05rem 0;
  }
  .mark{
    font-family:var(--sans); font-weight:600; font-size:.74rem;
    letter-spacing:.34em; text-transform:uppercase; color:#F2EDE3;
  }
  .mark i{
    display:block; font-style:normal; font-weight:400; font-size:.58rem;
    letter-spacing:.26em; color:var(--gold); margin-top:.3rem;
  }
  .count{
    font-family:var(--sans); font-size:.68rem; letter-spacing:.2em;
    text-transform:uppercase; color:rgba(242,237,227,.5);
    font-variant-numeric:tabular-nums;
  }
  .count b{color:var(--gold); font-weight:600}

  .track{height:2px; background:rgba(201,168,76,.16)}
  .fill{
    height:100%; width:0;
    background:linear-gradient(90deg,var(--gold-deep),var(--gold));
    transition:width .55s cubic-bezier(.33,1,.68,1);
  }

  main{flex:1; padding:4rem 0 5rem}
  .screen{animation:rise .5s cubic-bezier(.33,1,.68,1) both}
  @keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
  @media (prefers-reduced-motion:reduce){
    .screen{animation:none} .fill{transition:none} .opt{transition:none}
  }

  /* —— tipografia —— */
  .kicker{
    font-size:.66rem; font-weight:600; letter-spacing:.24em; text-transform:uppercase;
    color:var(--gold-deep); margin-bottom:1.5rem; display:flex; align-items:center; gap:.85rem;
  }
  .kicker::after{content:""; flex:1; height:1px; background:var(--gold-hair)}

  h1.q{
    font-family:var(--serif); font-weight:500;
    font-size:clamp(1.9rem,5.2vw,2.85rem); line-height:1.16;
    letter-spacing:-.005em; text-wrap:balance; color:var(--ink);
    margin-bottom:2.1rem; max-width:22ch;
  }
  h1.q em{font-style:italic; color:var(--gold-deep)}

  /* —— opções —— */
  .opts{display:flex; flex-direction:column; gap:.55rem; margin-bottom:1.6rem}
  .opt{
    position:relative; width:100%; text-align:left; cursor:pointer;
    background:var(--card); border:1px solid var(--line); border-radius:var(--r);
    padding:1.05rem 1.3rem 1.05rem 3.1rem;
    font-family:var(--sans); font-size:1rem; line-height:1.45; color:var(--ink-2);
    transition:border-color .2s, background .2s, color .2s, box-shadow .2s;
  }
  .opt::before{
    content:""; position:absolute; left:1.3rem; top:1.32rem;
    width:.5rem; height:.5rem; border:1px solid var(--line-2);
    transform:rotate(45deg); transition:all .2s;
  }
  .opt:hover{
    border-color:var(--gold-hair); background:#FDFBF6; color:var(--ink);
    box-shadow:0 2px 18px rgba(20,18,16,.05);
  }
  .opt:hover::before{border-color:var(--gold)}
  .opt.on{
    border-color:var(--gold); background:var(--gold-tint); color:var(--ink);
  }
  .opt.on::before{background:var(--gold); border-color:var(--gold)}
  .opt:focus-visible{outline:1px solid var(--gold-deep); outline-offset:3px}
  .hint{
    display:block; margin-top:.4rem; font-size:.72rem; letter-spacing:.12em;
    text-transform:uppercase; color:var(--ink-3); font-weight:500;
  }

  /* —— botões —— */
  .cta{
    display:inline-flex; align-items:center; gap:.8rem;
    background:var(--espresso); color:#F7F3EA; border:0; border-radius:var(--r);
    font-family:var(--sans); font-size:.82rem; font-weight:600;
    letter-spacing:.16em; text-transform:uppercase;
    padding:1.05rem 2.2rem; cursor:pointer;
    transition:background .2s, transform .12s;
  }
  .cta:hover{background:#241F1A; transform:translateY(-1px)}
  .cta:focus-visible{outline:1px solid var(--gold); outline-offset:3px}
  .cta span{color:var(--gold); font-size:1rem; line-height:1}

  .nav{display:flex; align-items:center; gap:1.5rem; margin-top:2rem}
  .back{
    background:none; border:0; cursor:pointer; padding:.3rem 0;
    font-family:var(--sans); font-size:.7rem; font-weight:500;
    letter-spacing:.18em; text-transform:uppercase; color:var(--ink-3);
    transition:color .2s;
  }
  .back:hover{color:var(--gold-deep)}

  /* —— formulário —— */
  .field{display:flex; flex-direction:column; gap:.45rem; margin-bottom:1.15rem}
  .field label{
    font-size:.64rem; font-weight:600; letter-spacing:.2em;
    text-transform:uppercase; color:var(--ink-3);
  }
  .field input{
    background:var(--card); border:1px solid var(--line); border-radius:var(--r);
    padding:.95rem 1.1rem; font-family:var(--sans); font-size:1rem; color:var(--ink);
    transition:border-color .2s;
  }
  .field input:focus{outline:none; border-color:var(--gold)}
  .field input::placeholder{color:#B9B1A7}
  .lede{font-size:1.02rem; color:var(--ink-2); margin-bottom:2rem; max-width:46ch}

  /* —— laudo —— */
  .laudo{
    background:var(--card); border:1px solid var(--line); border-radius:var(--r);
    box-shadow:0 6px 40px rgba(20,18,16,.06); overflow:hidden; margin-bottom:2rem;
  }
  .laudo .top{
    padding:2rem 2rem 1.6rem; border-bottom:1px solid var(--line);
    background:linear-gradient(180deg,#FCFAF5,var(--card));
  }
  .laudo .badge{
    font-size:.62rem; font-weight:600; letter-spacing:.24em; text-transform:uppercase;
    color:var(--gold-deep); display:block; margin-bottom:.9rem;
  }
  .laudo h2{
    font-family:var(--serif); font-weight:500; font-size:clamp(1.7rem,4.4vw,2.4rem);
    line-height:1.14; letter-spacing:-.005em; color:var(--ink);
  }
  .laudo .bd{padding:1.9rem 2rem 2.1rem}
  .laudo p{margin-bottom:1.15rem; color:var(--ink-2)}
  .laudo p:last-child{margin-bottom:0}
  .laudo p strong{color:var(--ink); font-weight:600}
  .rule{height:1px; background:var(--gold-hair); margin:1.5rem 0}

  /* —— bloco de teste —— */
  .dbg{
    border:1px dashed var(--line-2); border-radius:var(--r); background:#EFEDE7;
    padding:1.1rem 1.3rem; font-size:.76rem; line-height:1.85; color:var(--ink-2);
    font-variant-numeric:tabular-nums;
  }
  .dbg b{
    display:block; font-size:.62rem; letter-spacing:.2em; text-transform:uppercase;
    color:var(--gold-deep); margin-bottom:.6rem; font-weight:600;
  }

  .flag{
    background:var(--gold); color:#221B08; text-align:center; font-size:.6rem;
    font-weight:600; letter-spacing:.24em; text-transform:uppercase; padding:.5rem 1rem;
  }
  footer{
    border-top:1px solid var(--line); padding:1.6rem 0 2.4rem;
    font-size:.62rem; font-weight:500; letter-spacing:.2em;
    text-transform:uppercase; color:var(--ink-3);
  }

  @media(max-width:560px){
    main{padding:2.6rem 0 3.5rem}
    .laudo .top{padding:1.5rem 1.4rem 1.2rem}
    .laudo .bd{padding:1.4rem}
    .opt{padding:.95rem 1.1rem .95rem 2.8rem}
    .mark{letter-spacing:.24em; font-size:.68rem}
  }
</style>
</head>
<body>

<div class="flag">Versão de teste · sem integração com CRM ou planilha</div>

<div class="bar">
  <div class="wrap">
    <div class="mark">Juliana Godinho<i>Diagnóstico</i></div>
    <div class="count" id="count"></div>
  </div>
</div>
<div class="track"><div class="fill" id="fill"></div></div>

<main><div class="wrap"><div class="screen" id="screen"></div></div></main>

<footer><div class="wrap">Simple Acc · Quiz B · protótipo para validação</div></footer>

<script>
const QUADROS = {
  Q1:{
    nome:"A agenda virou o seu teto",
    laudo:"O seu gargalo hoje não é falta de cliente, é que o crescimento está amarrado às suas horas. Você chegou no ponto em que a semana inteira vai para o atendimento e não sobra tempo para olhar o negócio. Enquanto o faturamento depender de quantas pessoas cabem na sua agenda, ele tem um teto, e você já encostou nele.",
    caminho:"Separar o tempo de atender do tempo de tocar o negócio, e definir o que sai da sua mão primeiro."
  },
  Q2:{
    nome:"Sempre as mesmas clientes",
    laudo:"As suas clientes são fiéis e voltam sempre, e isso é mérito seu. O problema é que não está entrando cliente nova, e sem fluxo novo o faturamento fica preso no tamanho da carteira que você já tem. Você não tem um problema de fidelização, tem um problema de entrada.",
    caminho:"Criar fluxo de cliente nova sem depender de indicação, e subir o valor do que já é vendido para a base atual."
  },
  Q3:{
    nome:"A promoção virou o seu jeito de vender",
    laudo:"A promoção resolve o mês e cobra o preço no seguinte. O movimento aumenta, a margem some junto, e a sua base aprende a esperar o desconto para comprar. Faturar mais e sobrar menos não é impressão sua, é a consequência direta disso.",
    caminho:"Clareza de números primeiro, preço por valor depois, até a promoção deixar de ser o que sustenta a venda."
  },
  Q4:{
    nome:"Você cobra menos do que entrega",
    laudo:"O receio de perder quem já vem faz você segurar o preço, e aí o seu trabalho fica ancorado num valor que não corresponde ao que ele realmente vale. Aumentar a tabela sozinho não resolve, porque o que falta não é preço, é o que sustenta o preço.",
    caminho:"Construir tratamentos de maior valor e o posicionamento que sustenta o preço, em vez de mexer só na tabela."
  }
};

const PERGUNTAS = [
  { id:"carro", tipo:"unica",
    texto:"Qual desses tratamentos responde pela <em>maior parte</em> do seu faturamento hoje?",
    opts:[
      {t:"Tratamentos corporais"},{t:"Tratamentos faciais"},{t:"Injetáveis"},
      {t:"Pós-operatório"},{t:"Depilação a laser"},{t:"Tricologia"},
      {t:"Nenhuma dessas", fora:true}
    ]},
  { id:"cena", tipo:"unica",
    texto:"Pense na última semana. Qual dessas cenas aconteceu <em>mais vezes</em> na sua clínica ou consultório?",
    opts:[
      {t:"Terminei a semana só atendendo, sem tempo de postar nem de me organizar", q:"Q1"},
      {t:"Olhei a agenda e vi que são quase sempre as mesmas clientes", q:"Q2"},
      {t:"Mandei promoção para a base para fechar vendas", q:"Q3"},
      {t:"Deixei de cobrar o que valia porque achei que a cliente não ia pagar", q:"Q4"}
    ]},
  { id:"equipe", tipo:"unica",
    texto:"Quem atende na sua clínica ou consultório hoje?",
    opts:[{t:"Só eu"},{t:"Eu e mais uma pessoa"},{t:"Eu e uma equipe pequena"},
          {t:"Tenho equipe atendendo e eu atendo pouco"},{t:"Só administro, não atendo"}]},
  { id:"margem", tipo:"unica",
    texto:"Depois de pagar aluguel, produtos, impostos e quem trabalha com você, <em>quanto costuma sobrar</em> no fim do mês?",
    opts:[{t:"Quase nada, e em alguns meses falta"},{t:"Sobra pouco, e eu não sei dizer exatamente quanto"},
          {t:"Nunca fechei essa conta, não sei responder"},{t:"Sobra o suficiente para eu me pagar e reinvestir um pouco"},
          {t:"Sobra bem, e eu acompanho esse número de perto"}]},
  { id:"tentou", tipo:"multipla",
    texto:"O que você fez para vender mais?",
    opts:[{t:"Baixei preço ou fiz promoção"},{t:"Abri mais horários e atendi até mais tarde"},
          {t:"Investi em divulgação, tráfego ou equipamento novo"},{t:"Ainda não fiz nada diferente"}]},
  { id:"faturamento", tipo:"unica",
    texto:"Qual a média de faturamento mensal da sua clínica ou consultório?",
    opts:[{t:"Até R$ 5 mil", rota:"edp"},{t:"De R$ 5 mil a R$ 10 mil", rota:"edp"},
          {t:"De R$ 10 mil a R$ 20 mil", rota:"mentoria"},{t:"De R$ 20 mil a R$ 30 mil", rota:"mentoria"},
          {t:"De R$ 30 mil a R$ 50 mil", rota:"mentoria"},{t:"Acima de R$ 50 mil", rota:"mentoria"}]}
];

const TOTAL = PERGUNTAS.length;
const R = {};
let etapa = 1;       // abre direto na pergunta 1
let fora = false;

const screen = document.getElementById('screen');
const fill = document.getElementById('fill');
const count = document.getElementById('count');
const pad = n => String(n).padStart(2,'0');

function chrome(){
  let pct = 0;
  if(etapa >= 1 && etapa <= TOTAL) pct = ((etapa - 1) / TOTAL) * 100;
  else pct = 100;
  fill.style.width = pct + '%';
  count.innerHTML = (etapa >= 1 && etapa <= TOTAL)
    ? `<b>${pad(etapa)}</b> / ${pad(TOTAL)}` : '';
}

function render(){
  chrome();
  window.scrollTo({top:0,behavior:'smooth'});
  if(fora) return telaFora();
  if(etapa <= TOTAL) return pergunta(etapa - 1);
  if(etapa === TOTAL + 1) return captura();
  return resultado();
}

function pergunta(i){
  const P = PERGUNTAS[i];
  const sel = R[P.id];
  const on = k => P.tipo === 'multipla'
    ? (Array.isArray(sel) && sel.includes(k)) : sel === k;
  screen.innerHTML = `
    <p class="kicker">Pergunta ${pad(i+1)}</p>
    <h1 class="q">${P.texto}</h1>
    <div class="opts">${P.opts.map((o,k)=>
      `<button class="opt${on(k)?' on':''}" data-k="${k}">${o.t}</button>`).join('')}</div>
    ${P.tipo==='multipla'
      ? '<span class="hint">Pode marcar mais de uma</span><div class="nav"><button class="cta" id="next">Continuar <span>&rarr;</span></button>'
        + (i>0?'<button class="back" id="back">Voltar</button>':'') + '</div>'
      : (i>0?'<div class="nav"><button class="back" id="back">Voltar</button></div>':'')}`;

  screen.querySelectorAll('.opt').forEach(b => {
    b.onclick = () => {
      const k = +b.dataset.k;
      if(P.tipo === 'multipla'){
        const arr = Array.isArray(R[P.id]) ? R[P.id] : [];
        const at = arr.indexOf(k);
        at >= 0 ? arr.splice(at,1) : arr.push(k);
        R[P.id] = arr; b.classList.toggle('on'); return;
      }
      R[P.id] = k;
      if(P.opts[k].fora){ fora = true; render(); return; }
      screen.querySelectorAll('.opt').forEach(x => x.classList.remove('on'));
      b.classList.add('on');
      setTimeout(() => { etapa = i + 2; render(); }, 200);
    };
  });
  const nx = document.getElementById('next');
  if(nx) nx.onclick = () => { etapa = i + 2; render(); };
  const bk = document.getElementById('back');
  if(bk) bk.onclick = () => { etapa = i; render(); };
}

function telaFora(){
  fill.style.width = '100%'; count.innerHTML = '';
  screen.innerHTML = `
    <div class="laudo">
      <div class="top">
        <span class="badge">Diagnóstico encerrado</span>
        <h2>Este diagnóstico não foi construído para o seu momento</h2>
      </div>
      <div class="bd">
        <p>Ele parte da realidade específica de clínicas e consultórios de estética avançada, e é dela que sai tudo o que a Juliana ensina. Preferimos te dizer isso agora a te fazer percorrer um caminho que não vai te levar a lugar nenhum.</p>
        <p>Obrigado por ter chegado até aqui.</p>
      </div>
    </div>
    <div class="nav"><button class="back" id="reset">Recomeçar</button></div>`;
  document.getElementById('reset').onclick = () => {
    fora = false; etapa = 1; for(const k in R) delete R[k]; render();
  };
}

function captura(){
  screen.innerHTML = `
    <p class="kicker">Último passo</p>
    <h1 class="q">O seu diagnóstico está <em>pronto</em>.</h1>
    <p class="lede">Preencha para ver o resultado e receber a análise completa no WhatsApp.</p>
    <div class="field"><label>Nome</label><input type="text" id="nome" placeholder="Seu nome"></div>
    <div class="field"><label>WhatsApp com DDD</label><input type="tel" id="fone" placeholder="(00) 00000-0000"></div>
    <div class="field"><label>E-mail</label><input type="email" id="mail" placeholder="voce@email.com"></div>
    <div class="nav">
      <button class="cta" id="ver">Ver meu diagnóstico <span>&rarr;</span></button>
      <button class="back" id="back">Voltar</button>
    </div>`;
  document.getElementById('ver').onclick = () => {
    R._nome = document.getElementById('nome').value.trim();
    R._fone = document.getElementById('fone').value.trim();
    R._mail = document.getElementById('mail').value.trim();
    etapa = TOTAL + 2; render();
  };
  document.getElementById('back').onclick = () => { etapa = TOTAL; render(); };
}

function resultado(){
  fill.style.width = '100%'; count.innerHTML = '';
  const qKey = PERGUNTAS[1].opts[R.cena].q;
  const Q = QUADROS[qKey];
  const rota = PERGUNTAS[5].opts[R.faturamento].rota;
  const nome = R._nome ? R._nome.split(' ')[0] : '';

  const convite = rota === 'mentoria'
    ? `<p><strong>O seu próximo passo.</strong> Pelo que você respondeu, o seu momento é o de construir empresa, não o de organizar o começo. A Juliana abre algumas sessões por semana para conversar sobre isso pessoalmente, e vamos te chamar no WhatsApp para marcar a sua.</p>`
    : `<p><strong>O seu próximo passo.</strong> Pelo que você respondeu, o caminho mais curto para você agora é o EDP, que trabalha exatamente a base do que você está construindo. Vamos te chamar no WhatsApp com os detalhes.</p>`;

  screen.innerHTML = `
    <p class="kicker">${nome ? nome + ', este é o seu diagnóstico' : 'O seu diagnóstico'}</p>
    <div class="laudo">
      <div class="top">
        <span class="badge">O seu gargalo</span>
        <h2>${Q.nome}</h2>
      </div>
      <div class="bd">
        <p>${Q.laudo}</p>
        <div class="rule"></div>
        <p><strong>Por onde se resolve.</strong> ${Q.caminho} Isso é a direção, não o passo a passo. O passo a passo é o que a Juliana constrói com você.</p>
        ${convite}
      </div>
    </div>
    <div class="dbg">
      <b>Modo teste · o lead não vê este bloco</b>
      Quadro: ${qKey} · ${Q.nome}<br>
      Rota: ${rota === 'mentoria' ? 'MENTORIA (R$ 9.999)' : 'EDP (R$ 1.997)'}<br>
      Carro-chefe: ${PERGUNTAS[0].opts[R.carro].t}<br>
      Quem atende: ${PERGUNTAS[2].opts[R.equipe].t}<br>
      Margem: ${PERGUNTAS[3].opts[R.margem].t}<br>
      Já tentou: ${(R.tentou||[]).map(k=>PERGUNTAS[4].opts[k].t).join(' · ') || 'nada marcado'}<br>
      Faturamento: ${PERGUNTAS[5].opts[R.faturamento].t}
    </div>
    <div class="nav"><button class="back" id="reset">Testar outro caminho</button></div>`;
  document.getElementById('reset').onclick = () => {
    etapa = 1; fora = false; for(const k in R) delete R[k]; render();
  };
}

render();
</script>
</body>
</html>
