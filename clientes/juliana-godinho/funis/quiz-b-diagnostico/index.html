<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Diagnóstico · Ju Godinho</title>
<meta name="description" content="Descubra em 2 minutos qual gargalo está travando o crescimento da sua clínica ou consultório de estética avançada.">
<meta name="robots" content="noindex,nofollow">
<style>
  :root{
    --paper:#F5F6F4; --card:#FFFFFF; --sunk:#EDEFEC;
    --rule:#DBE0DA; --rule-hard:#C3CBC1;
    --ink:#16211E; --ink-2:#4A5852; --ink-3:#78857E;
    --acc:#1F4A45; --acc-2:#2F6E62; --acc-wash:#E7EDEA;
    --ment:#2F6E62; --edp:#8A6A24; --fora:#8C3F58;
    --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
    --serif:"Iowan Old Style","Palatino Linotype",Palatino,"Book Antiqua",Georgia,serif;
    --mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,monospace;
    --wrap:min(100% - 2.5rem, 40rem);
  }
  *{box-sizing:border-box}
  html{background:var(--paper)}
  body{
    margin:0; background:var(--paper); color:var(--ink);
    font-family:var(--sans); font-size:17px; line-height:1.6;
    -webkit-font-smoothing:antialiased; min-height:100vh;
  }
  .wrap{width:var(--wrap); margin-inline:auto}

  .topbar{border-bottom:1px solid var(--rule); background:var(--card)}
  .topbar .wrap{
    display:flex; align-items:baseline; justify-content:space-between;
    gap:1rem; padding:1rem 0; flex-wrap:wrap;
  }
  .brand{font-weight:750; letter-spacing:-.02em; font-size:1rem}
  .brand small{
    display:block; font-family:var(--mono); font-size:.62rem; letter-spacing:.16em;
    text-transform:uppercase; color:var(--acc); font-weight:600; margin-top:.15rem;
  }
  .steps{font-family:var(--mono); font-size:.68rem; letter-spacing:.12em; color:var(--ink-3); text-transform:uppercase}

  .track{height:3px; background:var(--rule)}
  .fill{height:100%; width:0; background:var(--acc); transition:width .4s cubic-bezier(.4,0,.2,1)}

  main{padding:3rem 0 4rem}
  .screen{animation:in .4s ease both}
  @keyframes in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
  @media (prefers-reduced-motion:reduce){.screen{animation:none}.fill{transition:none}}

  .eyebrow{
    font-family:var(--mono); font-size:.66rem; letter-spacing:.16em; text-transform:uppercase;
    color:var(--acc); font-weight:600; margin:0 0 1rem;
  }
  h1{
    font-weight:750; font-size:clamp(1.75rem,5vw,2.6rem); line-height:1.08;
    letter-spacing:-.03em; text-wrap:balance; margin:0 0 1rem;
  }
  h2.q{
    font-weight:700; font-size:clamp(1.3rem,3.6vw,1.7rem); line-height:1.2;
    letter-spacing:-.022em; text-wrap:balance; margin:0 0 1.6rem;
  }
  .lede{font-size:1.05rem; color:var(--ink-2); margin:0 0 1.6rem}
  .fine{font-size:.9rem; color:var(--ink-3); border-left:2px solid var(--rule-hard); padding-left:.9rem; margin:0 0 2rem}

  .opts{display:flex; flex-direction:column; gap:.6rem; margin:0 0 1.5rem}
  .opt{
    text-align:left; width:100%; background:var(--card); border:1px solid var(--rule);
    padding:.95rem 1.1rem .95rem 2.9rem; color:var(--ink); font-family:inherit;
    font-size:.98rem; line-height:1.4; cursor:pointer; position:relative;
    transition:border-color .15s, background .15s, transform .1s;
  }
  .opt::before{
    content:""; position:absolute; left:1.05rem; top:1.15rem;
    width:1rem; height:1rem; border:1.5px solid var(--rule-hard); border-radius:50%;
    transition:border-color .15s, background .15s, box-shadow .15s;
  }
  .opt:hover{border-color:var(--acc); background:var(--acc-wash)}
  .opt:hover::before{border-color:var(--acc)}
  .opt.on{border-color:var(--acc); background:var(--acc-wash)}
  .opt.on::before{background:var(--acc); border-color:var(--acc); box-shadow:inset 0 0 0 3px var(--card)}
  .opt:focus-visible{outline:2px solid var(--acc); outline-offset:2px}
  .opt .multi{
    position:absolute; right:1rem; top:1.05rem; font-family:var(--mono);
    font-size:.6rem; letter-spacing:.1em; color:var(--ink-3); text-transform:uppercase;
  }

  .cta{
    display:inline-block; background:var(--acc); color:#fff; border:0;
    font-family:inherit; font-size:1rem; font-weight:650; padding:.9rem 1.8rem;
    cursor:pointer; transition:filter .15s, transform .1s;
  }
  .cta:hover{filter:brightness(1.12)}
  .cta:focus-visible{outline:2px solid var(--acc); outline-offset:3px}
  .cta[disabled]{opacity:.4; cursor:not-allowed}

  .nav{display:flex; align-items:center; gap:1.2rem; margin-top:1.6rem}
  .back{
    background:none; border:0; color:var(--ink-3); font-family:inherit;
    font-size:.9rem; cursor:pointer; padding:.4rem 0;
  }
  .back:hover{color:var(--acc)}

  .field{display:flex; flex-direction:column; gap:.35rem; margin-bottom:1rem}
  .field label{font-family:var(--mono); font-size:.66rem; letter-spacing:.13em; text-transform:uppercase; color:var(--ink-3)}
  .field input{
    background:var(--card); border:1px solid var(--rule); padding:.8rem .95rem;
    color:var(--ink); font-family:inherit; font-size:1rem;
  }
  .field input:focus{outline:none; border-color:var(--acc)}

  .laudo{border:1px solid var(--rule); background:var(--card); margin:0 0 1.5rem}
  .laudo header{padding:1rem 1.25rem; background:var(--sunk); border-bottom:1px solid var(--rule)}
  .laudo .tag{
    font-family:var(--mono); font-size:.62rem; letter-spacing:.14em; text-transform:uppercase;
    font-weight:600; display:block; margin-bottom:.3rem;
  }
  .laudo h3{margin:0; font-size:1.2rem; font-weight:750; letter-spacing:-.02em}
  .laudo .bd{padding:1.2rem 1.25rem}
  .laudo p{margin:0 0 .9rem}
  .laudo p:last-child{margin:0}
  .t-ment{color:var(--ment)} .t-edp{color:var(--edp)} .t-fora{color:var(--fora)}

  .debug{
    border:1px dashed var(--rule-hard); background:var(--sunk); padding:.9rem 1.1rem;
    font-family:var(--mono); font-size:.72rem; color:var(--ink-2); margin-top:2rem;
    line-height:1.7;
  }
  .debug b{color:var(--acc); font-weight:600}

  footer{
    border-top:1px solid var(--rule); padding:1.5rem 0 2.5rem;
    font-family:var(--mono); font-size:.64rem; letter-spacing:.1em;
    text-transform:uppercase; color:var(--ink-3);
  }
  .flag{
    background:var(--acc); color:#fff; text-align:center;
    font-family:var(--mono); font-size:.62rem; letter-spacing:.16em;
    text-transform:uppercase; padding:.45rem 1rem; font-weight:600;
  }
</style>
</head>
<body>

<div class="flag">Versão de teste · sem integração com CRM ou planilha</div>

<div class="topbar">
  <div class="wrap">
    <div class="brand">Ju Godinho<small>Diagnóstico</small></div>
    <div class="steps" id="steps"></div>
  </div>
</div>
<div class="track"><div class="fill" id="fill"></div></div>

<main><div class="wrap"><div class="screen" id="screen"></div></div></main>

<footer><div class="wrap">Simple Acc · Quiz B · protótipo para validação interna</div></footer>

<script>
const QUADROS = {
  Q1:{
    nome:"A agenda virou o teto",
    laudo:"O seu gargalo hoje não é falta de cliente, é que o crescimento está amarrado às suas horas. Você chegou no ponto em que a semana inteira vai para o atendimento e não sobra tempo para olhar o negócio. Enquanto o faturamento depender de quantas pessoas cabem na sua agenda, ele tem um teto, e você já encostou nele.",
    caminho:"O caminho é separar o tempo de atender do tempo de tocar o negócio, e definir o que sai da sua mão primeiro."
  },
  Q2:{
    nome:"Sempre as mesmas clientes",
    laudo:"As suas clientes são fiéis e voltam sempre, e isso é mérito seu. O problema é que não está entrando cliente nova, e sem fluxo novo o faturamento fica preso no tamanho da carteira que você já tem. Você não tem um problema de fidelização, tem um problema de entrada.",
    caminho:"O caminho é criar fluxo de cliente nova sem depender de indicação, e subir o valor do que já é vendido para a base atual."
  },
  Q3:{
    nome:"Vende com desconto",
    laudo:"A promoção virou a forma de vender. Ela resolve o mês e cobra o preço no seguinte: o movimento aumenta, a margem some junto, e a sua base aprende a esperar o desconto para comprar. Faturar mais e sobrar menos não é impressão sua, é a consequência direta disso.",
    caminho:"O caminho é clareza de números primeiro, preço por valor depois, até a promoção deixar de ser o que sustenta a venda."
  },
  Q4:{
    nome:"Cobra menos do que vale",
    laudo:"Você entrega muito mais do que cobra. O receio de perder quem já vem faz você segurar o preço, e aí o seu trabalho fica ancorado num valor que não corresponde ao que ele realmente vale. Aumentar a tabela sozinho não resolve, porque o que falta não é preço, é o que sustenta o preço.",
    caminho:"O caminho é construir tratamentos de maior valor e o posicionamento que sustenta o preço, em vez de mexer só na tabela."
  }
};

const PERGUNTAS = [
  { id:"carro", tipo:"unica",
    texto:"Qual desses tratamentos responde pela maior parte do seu faturamento hoje?",
    opts:[
      {t:"Tratamentos corporais"},{t:"Tratamentos faciais"},{t:"Injetáveis"},
      {t:"Pós-operatório"},{t:"Depilação a laser"},{t:"Tricologia"},
      {t:"Nenhuma dessas", fora:true}
    ]},
  { id:"cena", tipo:"unica",
    texto:"Pense na última semana na sua clínica ou consultório. Qual dessas cenas aconteceu mais vezes?",
    opts:[
      {t:"Terminei a semana só atendendo, sem tempo de postar nem de me organizar", q:"Q1"},
      {t:"Olhei a agenda e vi que são quase sempre as mesmas clientes", q:"Q2"},
      {t:"Mandei promoção para a base para fechar vendas", q:"Q3"},
      {t:"Deixei de cobrar o que valia porque achei que a cliente não ia pagar", q:"Q4"}
    ]},
  { id:"equipe", tipo:"unica",
    texto:"Quem atende na sua clínica ou consultório hoje?",
    opts:[{t:"Só eu"},{t:"Eu e mais uma pessoa"},{t:"Eu e uma equipe pequena"},
          {t:"Tenho equipe atendendo e eu atendo pouco"},{t:"Só administro, não atendo"}]},
  { id:"margem", tipo:"unica",
    texto:"Depois de pagar aluguel, produtos, impostos e quem trabalha com você, quanto costuma sobrar no fim do mês?",
    opts:[{t:"Quase nada, e em alguns meses falta"},{t:"Sobra pouco, e eu não sei dizer exatamente quanto"},
          {t:"Nunca fechei essa conta, não sei responder"},{t:"Sobra o suficiente para eu me pagar e reinvestir um pouco"},
          {t:"Sobra bem, e eu acompanho esse número de perto"}]},
  { id:"tentou", tipo:"multipla",
    texto:"O que você fez para vender mais?",
    opts:[{t:"Baixei preço ou fiz promoção"},{t:"Abri mais horários e atendi até mais tarde"},
          {t:"Investi em divulgação, tráfego ou equipamento novo"},{t:"Ainda não fiz nada diferente"}]},
  { id:"faturamento", tipo:"unica",
    texto:"Qual a média de faturamento mensal da sua clínica ou consultório?",
    opts:[{t:"Até R$ 5 mil", rota:"edp"},{t:"De R$ 5 mil a R$ 10 mil", rota:"edp"},
          {t:"De R$ 10 mil a R$ 20 mil", rota:"mentoria"},{t:"De R$ 20 mil a R$ 30 mil", rota:"mentoria"},
          {t:"De R$ 30 mil a R$ 50 mil", rota:"mentoria"},{t:"Acima de R$ 50 mil", rota:"mentoria"}]}
];

const TOTAL = PERGUNTAS.length;
const R = {};           // respostas
let etapa = 0;          // 0 = capa, 1..6 = perguntas, 7 = captura, 8 = resultado
let fora = false;

const screen = document.getElementById('screen');
const fill = document.getElementById('fill');
const steps = document.getElementById('steps');

function progresso(){
  let pct = 0;
  if(etapa >= 1 && etapa <= TOTAL) pct = ((etapa - 1) / TOTAL) * 100;
  else if(etapa > TOTAL) pct = 100;
  fill.style.width = pct + '%';
  steps.textContent = (etapa >= 1 && etapa <= TOTAL) ? `Pergunta ${etapa} de ${TOTAL}` : '';
}

function render(){
  progresso();
  window.scrollTo({top:0,behavior:'smooth'});
  if(fora) return telaFora();
  if(etapa === 0) return capa();
  if(etapa <= TOTAL) return pergunta(etapa - 1);
  if(etapa === TOTAL + 1) return captura();
  return resultado();
}

function capa(){
  screen.innerHTML = `
    <p class="eyebrow">Para donas de clínica ou consultório de estética avançada</p>
    <h1>Sua agenda está cheia e mesmo assim o dinheiro não sobra.</h1>
    <p class="lede">Mesmo com muita certificação, muita técnica e bons resultados, chega um ponto em que atender mais para de resolver. São seis perguntas, menos de dois minutos, e no final você descobre qual dos quatro gargalos está travando o seu crescimento.</p>
    <p class="fine">Este diagnóstico foi feito para quem já tem clínica ou consultório funcionando, com clientes e faturamento. Se você ainda está começando, ele não vai te ajudar.</p>
    <button class="cta" id="go">Começar o diagnóstico</button>`;
  document.getElementById('go').onclick = () => { etapa = 1; render(); };
}

function pergunta(i){
  const P = PERGUNTAS[i];
  const sel = R[P.id];
  const marcado = o => P.tipo === 'multipla'
    ? (Array.isArray(sel) && sel.includes(o)) : sel === o;
  screen.innerHTML = `
    <p class="eyebrow">Pergunta ${i+1} de ${TOTAL}</p>
    <h2 class="q">${P.texto}</h2>
    <div class="opts">${P.opts.map((o,k)=>
      `<button class="opt${marcado(k)?' on':''}" data-k="${k}">${o.t}${
        P.tipo==='multipla' ? '<span class="multi">pode marcar mais de uma</span>' : ''}</button>`
    ).join('')}</div>
    ${P.tipo==='multipla' ? '<button class="cta" id="next">Continuar</button>' : ''}
    <div class="nav">${i>0 ? '<button class="back" id="back">Voltar</button>' : ''}</div>`;

  screen.querySelectorAll('.opt').forEach(b => {
    b.onclick = () => {
      const k = +b.dataset.k;
      if(P.tipo === 'multipla'){
        const arr = Array.isArray(R[P.id]) ? R[P.id] : [];
        const at = arr.indexOf(k);
        at >= 0 ? arr.splice(at,1) : arr.push(k);
        R[P.id] = arr;
        b.classList.toggle('on');
        return;
      }
      R[P.id] = k;
      if(P.opts[k].fora){ fora = true; render(); return; }
      screen.querySelectorAll('.opt').forEach(x => x.classList.remove('on'));
      b.classList.add('on');
      setTimeout(() => { etapa = i + 2; render(); }, 170);
    };
  });
  const nx = document.getElementById('next');
  if(nx) nx.onclick = () => { etapa = i + 2; render(); };
  const bk = document.getElementById('back');
  if(bk) bk.onclick = () => { etapa = i; render(); };
}

function telaFora(){
  fill.style.width = '100%'; steps.textContent = '';
  screen.innerHTML = `
    <div class="laudo">
      <header><span class="tag t-fora">Fora do escopo</span><h3>Este diagnóstico não foi feito para o seu momento</h3></header>
      <div class="bd">
        <p>Ele foi construído para clínicas e consultórios de estética avançada, e o que a Ju ensina parte dessa realidade específica. Aplicar isso em outro modelo de negócio não geraria o resultado que ela quer assinar, e preferimos dizer isso agora a te fazer perder tempo.</p>
        <p>Obrigado por ter chegado até aqui.</p>
      </div>
    </div>
    <div class="nav"><button class="back" id="reset">Recomeçar</button></div>`;
  document.getElementById('reset').onclick = () => { fora = false; etapa = 0; for(const k in R) delete R[k]; render(); };
}

function captura(){
  screen.innerHTML = `
    <p class="eyebrow">Último passo</p>
    <h2 class="q">Seu diagnóstico está pronto.</h2>
    <p class="lede">Preencha para ver o seu resultado e receber a análise completa no WhatsApp.</p>
    <div class="field"><label>Nome</label><input type="text" id="nome" placeholder="Seu nome"></div>
    <div class="field"><label>WhatsApp com DDD</label><input type="tel" id="fone" placeholder="(00) 00000-0000"></div>
    <div class="field"><label>E-mail</label><input type="email" id="mail" placeholder="voce@email.com"></div>
    <button class="cta" id="ver">Ver meu diagnóstico</button>
    <div class="nav"><button class="back" id="back">Voltar</button></div>`;
  document.getElementById('ver').onclick = () => {
    R._nome = document.getElementById('nome').value.trim();
    R._fone = document.getElementById('fone').value.trim();
    R._mail = document.getElementById('mail').value.trim();
    etapa = TOTAL + 2; render();
  };
  document.getElementById('back').onclick = () => { etapa = TOTAL; render(); };
}

function resultado(){
  fill.style.width = '100%'; steps.textContent = '';
  const qKey = PERGUNTAS[1].opts[R.cena].q;
  const Q = QUADROS[qKey];
  const rota = PERGUNTAS[5].opts[R.faturamento].rota;
  const nome = R._nome ? R._nome.split(' ')[0] : '';

  const convite = rota === 'mentoria'
    ? `<p><strong>O seu próximo passo.</strong> Pelo que você respondeu, o seu momento é o de construir empresa, não o de organizar o começo. A Ju abre algumas sessões por semana para conversar sobre isso pessoalmente. Vamos te chamar no WhatsApp para marcar a sua.</p>`
    : `<p><strong>O seu próximo passo.</strong> Pelo que você respondeu, o caminho mais curto para você agora é o EDP, que trabalha exatamente a base do que você está construindo. Vamos te chamar no WhatsApp com os detalhes.</p>`;

  screen.innerHTML = `
    <p class="eyebrow">${nome ? nome + ', seu' : 'Seu'} diagnóstico</p>
    <div class="laudo">
      <header>
        <span class="tag ${rota === 'mentoria' ? 't-ment' : 't-edp'}">O seu gargalo</span>
        <h3>${Q.nome}</h3>
      </header>
      <div class="bd">
        <p>${Q.laudo}</p>
        <p><strong>Por onde se resolve.</strong> ${Q.caminho} Não é o passo a passo, é a direção. O passo a passo é o que a Ju constrói com você.</p>
        ${convite}
      </div>
    </div>
    <div class="debug">
      <b>Modo teste, o lead não vê este bloco</b><br>
      Quadro: ${qKey} · ${Q.nome}<br>
      Rota: ${rota === 'mentoria' ? 'MENTORIA (R$ 9.999)' : 'EDP (R$ 1.997)'}<br>
      Carro-chefe: ${PERGUNTAS[0].opts[R.carro].t}<br>
      Quem atende: ${PERGUNTAS[2].opts[R.equipe].t}<br>
      Margem: ${PERGUNTAS[3].opts[R.margem].t}<br>
      Já tentou: ${(R.tentou||[]).map(k=>PERGUNTAS[4].opts[k].t).join(' | ') || 'nada marcado'}<br>
      Faturamento: ${PERGUNTAS[5].opts[R.faturamento].t}
    </div>
    <div class="nav"><button class="back" id="reset">Testar outro caminho</button></div>`;
  document.getElementById('reset').onclick = () => { etapa = 0; fora = false; for(const k in R) delete R[k]; render(); };
}

render();
</script>
</body>
</html>
