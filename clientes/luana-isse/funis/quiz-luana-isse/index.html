<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex" />
  <title>Diagnóstico de Autoridade · Luana Isse</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg" />
  <meta name="description" content="Descubra o tamanho da sua Ruptura de Valor Percebido: a distância entre o que você sabe e o que o mercado enxerga." />
  <style>
    :root{--bg:#FFFFFF;--text:#030118}
    body{margin:0;background:var(--bg);color:var(--text);
      font-family:"Montserrat",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif}
  </style>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <!-- Fontes do manual, carregadas sem bloquear a renderização: se o Google
       Fonts demorar ou cair, a página abre na pilha local e nada trava. -->
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700&family=Playfair+Display:wght@600;700&display=swap"
        media="print" onload="this.media='all'" />
  <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700&family=Playfair+Display:wght@600;700&display=swap" /></noscript>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="topbar">
    <div class="container">
      <div class="brand">
        <img class="logo-img" src="logo.png" alt="Luana Isse" width="320" height="74" />
        <span class="brand-tag">Método MMPV</span>
      </div>
    </div>
  </header>

  <!-- Só a barra enchendo. Sem "Pergunta X de N" e sem porcentagem: número
       aqui faz o quiz parecer longo e medido, e derruba conclusão. -->
  <div class="progress-wrap" id="progress" hidden>
    <div class="container">
      <div class="progress-track"><div class="progress-bar" id="progress-bar"></div></div>
    </div>
  </div>

  <main class="container">
    <div id="app" aria-live="polite"></div>
  </main>

  <script src="flow.js" defer></script>
  <script src="app.js" defer></script>
</body>
</html>
