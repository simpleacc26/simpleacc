<style>
  :root{
    --brand-primary:#C8B28B;
    --brand-light:#DDCBAD;
    --brand-dark:#8C7857;
    --light-bg:#F6F2E9;
    --light-border:#E6DECD;
    --dark-bg:#1C1C42;
    --dark-surface:#292859;
    --muted-light:#857C6B;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    padding:40px 16px;
    background:#0E0E24;
    font-family:'Inter',system-ui,-apple-system,sans-serif;
    display:flex;
    justify-content:center;
    align-items:flex-start;
  }
  .serif{font-family:'Fahkwang',sans-serif;}
  .sans{font-family:'Inter',system-ui,sans-serif;}

  /* ---------- Instagram frame (preview only) ---------- */
  .ig-frame{
    width:420px;
    max-width:420px;
    background:#fff;
    border-radius:14px;
    overflow:hidden;
    box-shadow:0 24px 60px rgba(0,0,0,.45);
  }
  .ig-header{display:flex;align-items:center;gap:10px;padding:12px 14px;}
  .ig-avatar{
    width:36px;height:36px;border-radius:50%;
    background:var(--brand-primary);
    display:flex;align-items:center;justify-content:center;
    font-family:'Fahkwang',sans-serif;font-weight:600;font-size:16px;color:var(--dark-bg);
    flex:none;
  }
  .ig-handle{font-size:13px;font-weight:600;color:#111;line-height:1.2;}
  .ig-sub{font-size:11px;color:#8E8E8E;line-height:1.3;}
  .ig-more{margin-left:auto;color:#111;font-size:18px;letter-spacing:1px;}

  .carousel-viewport{
    width:100%;
    aspect-ratio:4/5;
    overflow:hidden;
    position:relative;
    cursor:grab;
    background:var(--light-bg);
    touch-action:pan-y;
  }
  .carousel-viewport:active{cursor:grabbing;}
  .carousel-track{display:flex;height:100%;will-change:transform;transition:transform .32s cubic-bezier(.22,.61,.36,1);}
  .slide{
    width:420px;height:100%;flex:none;position:relative;overflow:hidden;
    display:flex;flex-direction:column;
  }
  /* Direita com 54px: a seta de swipe ocupa 48px e o texto não pode entrar
     debaixo dela. Uniforme em todos os slides pra manter a mesma coluna. */
  .slide-inner{flex:1;display:flex;flex-direction:column;padding:0 54px 52px 36px;}

  .ig-dots{display:flex;justify-content:center;gap:5px;padding:12px 0 4px;}
  .ig-dot{width:6px;height:6px;border-radius:50%;background:#D5D5D5;transition:background .2s;}
  .ig-dot.on{background:var(--brand-dark);}
  .ig-actions{display:flex;align-items:center;gap:14px;padding:6px 14px 2px;}
  .ig-actions .spacer{margin-left:auto;}
  .ig-caption{padding:4px 14px 16px;font-size:13px;color:#111;line-height:1.45;}
  .ig-caption .h{font-weight:600;}
  .ig-time{display:block;margin-top:6px;font-size:10px;letter-spacing:.4px;color:#8E8E8E;text-transform:uppercase;}

  .tag{display:inline-block;font-size:10px;font-weight:600;letter-spacing:2px;text-transform:uppercase;}
  h2.head{margin:0;font-weight:600;letter-spacing:-.4px;line-height:1.13;}
  p.body{margin:0;font-size:14px;font-weight:400;line-height:1.55;}
</style>
</head>
<body>

<div class="ig-frame">
  <div class="ig-header">
    <div class="ig-avatar serif">A</div>
    <div>
      <div class="ig-handle">rafaelgranella</div>
      <div class="ig-sub">Alivance Club</div>
    </div>
    <div class="ig-more">•••</div>
  </div>

  <div class="carousel-viewport" id="viewport">
    <div class="carousel-track" id="track"></div>
  </div>

  <div class="ig-dots" id="dots"></div>

  <div class="ig-actions">
    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#111" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M20.8 4.6a5.5 5.5 0 00-7.8 0L12 5.7l-1-1.1a5.5 5.5 0 10-7.8 7.8l8.8 8.8 8.8-8.8a5.5 5.5 0 000-7.8z"/></svg>
    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#111" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 11.5a8.4 8.4 0 01-9 8.4 8.9 8.9 0 01-3.8-.9L3 20.5l1.5-4.4A8.4 8.4 0 1121 11.5z"/></svg>
    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#111" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M22 2L11 13"/><path d="M22 2l-7 20-4-9-9-4 20-7z"/></svg>
    <svg class="spacer" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#111" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M19 21l-7-5-7 5V5a2 2 0 012-2h10a2 2 0 012 2z"/></svg>
  </div>

  <div class="ig-caption">
    <span class="h">rafaelgranella</span> Agenda cheia e receita estagnada ao mesmo tempo? O problema não é esforço, é estrutura. Os 4 pilares que definem o teto do seu negócio de mentoria — e como descobrir qual está travando o seu. Diagnóstico gratuito no link da bio.
    <span class="ig-time">Há 2 horas</span>
  </div>
</div>

<script>
/* ===================== TOKENS ===================== */
const B      = '#C8B28B';  /* BRAND_PRIMARY */
const BL     = '#DDCBAD';  /* BRAND_LIGHT   */
const BD     = '#8C7857';  /* BRAND_DARK    */
const LIGHT  = '#F6F2E9';  /* LIGHT_BG      */
const BORDER = '#E6DECD';  /* LIGHT_BORDER  */
const DARK   = '#1C1C42';  /* DARK_BG       */
const SURF   = '#292859';  /* superfície do quiz */
const MUTED  = '#857C6B';
const GRAD   = `linear-gradient(165deg, ${BD} 0%, ${B} 50%, ${BL} 100%)`;

/* Três "temas" de fundo. 'grad' é dourado com texto índigo — é o padrão do
   quiz (estado selecionado / botão de CTA: fundo #C8B28B, texto #1c1c42). */
const THEME = {
  light: { arrowBg:'rgba(0,0,0,0.06)',        arrowStroke:'rgba(0,0,0,0.25)',
           track:'rgba(0,0,0,0.08)',          fill:BD,   counter:'rgba(0,0,0,0.3)' },
  dark:  { arrowBg:'rgba(255,255,255,0.08)',  arrowStroke:'rgba(255,255,255,0.35)',
           track:'rgba(255,255,255,0.12)',    fill:'#fff', counter:'rgba(255,255,255,0.4)' },
  grad:  { arrowBg:'rgba(28,28,66,0.08)',     arrowStroke:'rgba(28,28,66,0.30)',
           track:'rgba(28,28,66,0.12)',       fill:DARK, counter:'rgba(28,28,66,0.45)' },
};

/* ===================== COMPONENTES ===================== */
function progressBar(index, total, theme){
  const t = THEME[theme];
  const pct = ((index + 1) / total) * 100;
  return `<div style="position:absolute;bottom:0;left:0;right:0;padding:16px 28px 20px;z-index:10;display:flex;align-items:center;gap:10px;">
    <div style="flex:1;height:3px;background:${t.track};border-radius:2px;overflow:hidden;">
      <div style="height:100%;width:${pct}%;background:${t.fill};border-radius:2px;"></div>
    </div>
    <span class="sans" style="font-size:11px;color:${t.counter};font-weight:500;">${index + 1}/${total}</span>
  </div>`;
}

function swipeArrow(theme){
  const t = THEME[theme];
  return `<div style="position:absolute;right:0;top:0;bottom:0;width:48px;z-index:9;display:flex;align-items:center;justify-content:center;background:linear-gradient(to right,transparent,${t.arrowBg});">
    <svg width="24" height="24" viewBox="0 0 24 24" fill="none">
      <path d="M9 6l6 6-6 6" stroke="${t.arrowStroke}" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
  </div>`;
}

function tag(text, theme){
  const color = theme === 'light' ? BD : (theme === 'dark' ? BL : 'rgba(28,28,66,0.72)');
  return `<span class="sans tag" style="color:${color};margin-bottom:16px;">${text}</span>`;
}

function lockup(theme){
  const ring   = theme === 'grad' ? DARK : B;
  const letter = theme === 'grad' ? B : DARK;
  const name   = theme === 'light' ? DARK : (theme === 'dark' ? '#fff' : DARK);
  return `<div style="display:flex;align-items:center;gap:12px;">
    <div class="serif" style="width:40px;height:40px;border-radius:50%;background:${ring};display:flex;align-items:center;justify-content:center;font-size:18px;font-weight:600;color:${letter};">A</div>
    <span class="sans" style="font-size:13px;font-weight:600;letter-spacing:.5px;color:${name};">ALIVANCE CLUB</span>
  </div>`;
}

/* linha numerada (pilar / passo). `isLast` tira a divisória do último item —
   senão sobra uma linha pendurada acima da barra de progresso. */
function step(num, title, desc, theme, isLast){
  const line  = theme === 'light' ? BORDER : (theme === 'dark' ? 'rgba(255,255,255,0.10)' : 'rgba(28,28,66,0.15)');
  const numC  = theme === 'light' ? BD : (theme === 'dark' ? B : DARK);
  const titleC= theme === 'light' ? DARK : (theme === 'dark' ? '#fff' : DARK);
  const descC = theme === 'light' ? MUTED : (theme === 'dark' ? 'rgba(255,255,255,0.55)' : 'rgba(28,28,66,0.6)');
  const border = isLast ? 'none' : `1px solid ${line}`;
  return `<div style="display:flex;align-items:flex-start;gap:16px;padding:13px 0;border-bottom:${border};">
    <span class="serif" style="font-size:26px;font-weight:300;color:${numC};min-width:34px;line-height:1;">${num}</span>
    <div>
      <span class="sans" style="display:block;font-size:14px;font-weight:600;color:${titleC};margin-bottom:3px;">${title}</span>
      <span class="sans" style="display:block;font-size:12px;line-height:1.45;color:${descC};">${desc}</span>
    </div>
  </div>`;
}

/* pílula riscada (o que já tentaram e não resolveu) */
function strikePill(text){
  return `<span class="sans" style="font-size:11px;padding:5px 12px;border:1px solid rgba(255,255,255,0.12);border-radius:20px;color:rgba(255,255,255,0.45);text-decoration:line-through;">${text}</span>`;
}

/* caixa de citação */
function quoteBox(label, quote, theme){
  const bg     = theme === 'dark' ? SURF : 'rgba(28,28,66,0.10)';
  const brd    = theme === 'dark' ? 'rgba(255,255,255,0.08)' : 'rgba(28,28,66,0.15)';
  const labelC = theme === 'dark' ? 'rgba(255,255,255,0.5)' : 'rgba(28,28,66,0.55)';
  const quoteC = theme === 'dark' ? '#fff' : DARK;
  return `<div style="padding:16px;background:${bg};border-radius:12px;border:1px solid ${brd};">
    <p class="sans" style="margin:0 0 6px;font-size:13px;color:${labelC};">${label}</p>
    <p class="serif" style="margin:0;font-size:15px;font-weight:400;color:${quoteC};font-style:italic;line-height:1.4;">“${quote}”</p>
  </div>`;
}

/* ===================== SLIDES ===================== */
const SLIDES = [
  /* 1 — HERO */
  { theme:'light', align:'center', html: t => `
      ${lockup(t)}
      <div style="height:30px;"></div>
      ${tag('DIAGNÓSTICO ALIVANCE', t)}
      <h2 class="serif head" style="font-size:31px;color:${DARK};">Agenda cheia.<br/>Receita estagnada.</h2>
      <div style="height:18px;"></div>
      <p class="sans body" style="color:${MUTED};">Quando os dois acontecem ao mesmo tempo, o problema não é o seu esforço. É a estrutura do seu negócio.</p>
  `},

  /* 2 — PROBLEMA */
  { theme:'dark', align:'flex-end', html: t => `
      ${tag('O QUE TODO MUNDO TENTA', t)}
      <h2 class="serif head" style="font-size:30px;color:${B};">Você já tentou de tudo. E o patamar não mudou.</h2>
      <div style="height:16px;"></div>
      <p class="sans body" style="color:rgba(255,255,255,0.62);">Todo mentor que trava repete a mesma sequência. Nenhuma dessas ações ataca a causa.</p>
      <div style="height:20px;"></div>
      <div style="display:flex;flex-wrap:wrap;gap:8px;">
        ${strikePill('Aumentar o preço')}
        ${strikePill('Tráfego pago')}
        ${strikePill('Formato em grupo')}
        ${strikePill('Postar mais')}
      </div>
      <div style="height:20px;"></div>
      <p class="sans" style="margin:0;font-size:13px;line-height:1.5;color:rgba(255,255,255,0.45);">São ajustes de superfície num problema de estrutura.</p>
  `},

  /* 3 — VIRADA (gradiente da marca) */
  { theme:'grad', align:'center', html: t => `
      ${tag('A VIRADA', t)}
      <h2 class="serif head" style="font-size:32px;color:${DARK};">O seu teto não é de esforço. É de estrutura.</h2>
      <div style="height:18px;"></div>
      <p class="sans body" style="color:rgba(28,28,66,0.65);">Um negócio de educação se sustenta em quatro pilares. O crescimento para no mais fraco deles, não no que você mais trabalha.</p>
      <div style="height:22px;"></div>
      ${quoteBox('O que define o seu teto', 'Quando um pilar trava, o negócio inteiro para de subir.', t)}
  `},

  /* 4 — PILARES 01 e 02 */
  { theme:'light', align:'flex-end', html: t => `
      ${tag('OS 4 PILARES · 01–02', t)}
      <h2 class="serif head" style="font-size:29px;color:${DARK};">Método e modelo de negócio</h2>
      <div style="height:14px;"></div>
      ${step('01','Método','Seu conhecimento precisa virar sistema. Enquanto ele mora só na sua cabeça, a entrega depende da sua presença — e o cliente recebe a sua versão do dia, não consistência.', t)}
      ${step('02','Modelo de negócio','Como você empacota, precifica e entrega define o teto. Sessão avulsa tem um teto. Programa fechado tem outro. Clube bem estruturado tem outro completamente.', t, true)}
  `},

  /* 5 — PILARES 03 e 04 */
  { theme:'dark', align:'flex-end', html: t => `
      ${tag('OS 4 PILARES · 03–04', t)}
      <h2 class="serif head" style="font-size:29px;color:${B};">Processo de vendas e mentalidade</h2>
      <div style="height:12px;"></div>
      ${step('03','Processo de vendas','Depender de indicação e networking não é estratégia, é aposta. Com processo, o faturamento deixa de oscilar.', t)}
      ${step('04','Mentalidade','O pilar que ninguém quer encarar — e o que mais trava. Crenças operando como teto invisível.', t, true)}
      <div style="height:16px;"></div>
      ${quoteBox('Pilar 04', 'Cobrar R$115.000 por ano exige uma identidade diferente de cobrar R$15.000.', t)}
  `},

  /* 6 — COMO DESCOBRIR */
  { theme:'light', align:'flex-end', html: t => `
      ${tag('COMO DESCOBRIR O SEU', t)}
      <h2 class="serif head" style="font-size:30px;color:${DARK};">Um diagnóstico em 30 segundos</h2>
      <div style="height:14px;"></div>
      ${step('01','Responda 7 perguntas','Sobre o seu modelo de entrega, o seu gargalo real e o seu objetivo para os próximos 12 meses.', t)}
      ${step('02','Receba o diagnóstico','Personalizado: qual pilar está travando o seu próximo salto e o que ele está custando.', t)}
      ${step('03','Agende a sessão','Análise individual do seu negócio com o time do Rafael. Sem pitch, sem fórmula genérica.', t, true)}
  `},

  /* 7 — CTA (sem seta, barra em 100%) */
  { theme:'grad', align:'center', html: t => `
      ${lockup(t)}
      <div style="height:28px;"></div>
      <h2 class="serif head" style="font-size:31px;color:${DARK};">Descubra o que está travando o seu próximo salto.</h2>
      <div style="height:16px;"></div>
      <p class="sans body" style="color:rgba(28,28,66,0.65);">O diagnóstico é gratuito, leva 30 segundos e você sai com clareza do próximo movimento.</p>
      <div style="height:26px;"></div>
      <div class="sans" style="display:inline-flex;align-items:center;gap:8px;padding:12px 28px;background:${DARK};color:${B};font-weight:600;font-size:14px;border-radius:28px;">
        Fazer meu diagnóstico
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none"><path d="M5 12h14M13 6l6 6-6 6" stroke="${B}" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </div>
      <div style="height:18px;"></div>
      <p class="sans" style="margin:0;font-size:11px;letter-spacing:.6px;color:rgba(28,28,66,0.62);">quiz.rafaelgranella.com.br</p>
  `},
];

/* ===================== RENDER ===================== */
const TOTAL = SLIDES.length;
const track = document.getElementById('track');
const dots  = document.getElementById('dots');

track.innerHTML = SLIDES.map((s, i) => {
  const bg = s.theme === 'light' ? LIGHT : (s.theme === 'dark' ? DARK : GRAD);
  const isLast = i === TOTAL - 1;
  return `<div class="slide" style="background:${bg};">
    <div class="slide-inner" style="justify-content:${s.align};">${s.html(s.theme)}</div>
    ${isLast ? '' : swipeArrow(s.theme)}
    ${progressBar(i, TOTAL, s.theme)}
  </div>`;
}).join('');

dots.innerHTML = SLIDES.map((_, i) => `<div class="ig-dot${i === 0 ? ' on' : ''}"></div>`).join('');

/* ===================== SWIPE (preview) ===================== */
const SLIDE_W = 420;
let index = 0, dragging = false, startX = 0, delta = 0;
const viewport = document.getElementById('viewport');

function goTo(i){
  index = Math.max(0, Math.min(TOTAL - 1, i));
  track.style.transition = 'transform .32s cubic-bezier(.22,.61,.36,1)';
  track.style.transform = `translateX(${-index * SLIDE_W}px)`;
  [...dots.children].forEach((d, n) => d.classList.toggle('on', n === index));
}

viewport.addEventListener('pointerdown', e => {
  dragging = true; startX = e.clientX; delta = 0;
  track.style.transition = 'none';
  viewport.setPointerCapture(e.pointerId);
});
viewport.addEventListener('pointermove', e => {
  if(!dragging) return;
  delta = e.clientX - startX;
  track.style.transform = `translateX(${-index * SLIDE_W + delta}px)`;
});
function endDrag(){
  if(!dragging) return;
  dragging = false;
  if(Math.abs(delta) > 60) goTo(index + (delta < 0 ? 1 : -1));
  else goTo(index);
}
viewport.addEventListener('pointerup', endDrag);
viewport.addEventListener('pointercancel', endDrag);
window.addEventListener('keydown', e => {
  if(e.key === 'ArrowRight') goTo(index + 1);
  if(e.key === 'ArrowLeft')  goTo(index - 1);
});

goTo(0);
</script>
</body>
</html>
