<!DOCTYPE html>
<!--
  CARROSSEL DE ANÚNCIO — Gustavo Ono (@gustavo_ono)
  Ângulo: "se eu te desse um conselho, seria este"
  Copy: fornecida pelo cliente, 5 blocos, um por slide.

  QUARTO sistema de composição do cliente. Mesma identidade
  (creme #EFE5D6, cacau #3B2A20, marrom #7A5540, salmão #E08A8A,
  Playfair Display + Plus Jakarta Sans), outra estrutura:
    - TEXTO CENTRALIZADO, o único dos quatro. Os outros três são alinhados à esquerda
    - NEGAÇÃO RISCADA e correção em serifa logo abaixo, que é a espinha desta copy:
      dois "não é" seguidos de um "o que você precisa é"
    - RETRATO EM DISCO abrindo e fechando, como parênteses da conversa
    - SEM rótulos nem selos, nenhum. É a peça silenciosa da série
    - muito respiro: um pensamento por slide, nada disputando atenção

  Este é o arquivo que se edita. Rode embutir-imagens.py para gerar o
  carrossel.html autocontido.
-->
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Carrossel Gustavo Ono: um conselho</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500;1,600&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
:root{
  --cream:      #EFE5D6;
  --cream-line: #DCCDB6;
  --cocoa:      #3B2A20;
  --brown:      #7A5540;
  --brown-soft: #A9866A;
  --salmon:     #E08A8A;
  --ink:        #4A3A2E;

  --font-display: 'Playfair Display', Georgia, serif;
  --font-text:    'Plus Jakarta Sans', system-ui, sans-serif;

  --slide-w: 420px;
  --slide-h: 525px;
}

*{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--font-text);background:#DED3C2;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:32px 16px}
.serif{font-family:var(--font-display)}
.sans {font-family:var(--font-text)}

/* ============ MOLDURA DO INSTAGRAM (só preview) ============ */
.ig-frame{width:420px;max-width:100%;background:#fff;border-radius:12px;box-shadow:0 8px 40px rgba(59,42,32,.22);overflow:hidden}
.ig-header{display:flex;align-items:center;gap:10px;padding:12px 14px}
.ig-avatar{width:34px;height:34px;border-radius:50%;flex:0 0 auto;overflow:hidden}
.ig-avatar img{width:100%;height:100%;object-fit:cover;display:block}
.ig-handle{font-size:13px;font-weight:700;color:#111;line-height:1.2}
.ig-sub{font-size:11px;color:#8A8580;line-height:1.2}
.ig-dots{display:flex;justify-content:center;gap:5px;padding:10px 0 4px}
.ig-dot{width:6px;height:6px;border-radius:50%;background:#D5D5D5;transition:background .2s}
.ig-dot.on{background:var(--brown)}
.ig-actions{display:flex;gap:14px;padding:6px 14px 2px;color:#111}
.ig-actions .spacer{flex:1}
.ig-caption{padding:6px 14px 14px;font-size:13px;line-height:1.45;color:#111}
.ig-caption .ts{display:block;margin-top:8px;font-size:10px;letter-spacing:.4px;color:#9A9A9A}

/* ============ VIEWPORT ============ */
.carousel-viewport{width:100%;aspect-ratio:4/5;overflow:hidden;position:relative;cursor:grab;touch-action:pan-y;user-select:none}
.carousel-viewport.dragging{cursor:grabbing}
.carousel-track{display:flex;height:100%;transition:transform .32s cubic-bezier(.22,.61,.36,1);will-change:transform}

/* ============ SLIDE ============ */
.slide{flex:0 0 var(--slide-w);width:var(--slide-w);height:100%;position:relative;overflow:hidden;display:flex;flex-direction:column;-webkit-font-smoothing:antialiased}
.slide.bg-light{background:var(--cream);color:var(--ink)}
.slide.bg-dark {background:var(--cocoa);color:var(--cream)}

/* tudo centralizado: é o que separa esta peça das outras três */
.slide-body{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;
  text-align:center;padding:62px 34px 74px;position:relative;z-index:2}
.medida{max-width:330px}

/* ============ RETRATO EM DISCO ============ */
.disco{width:150px;height:150px;border-radius:50%;overflow:hidden;flex:0 0 auto;margin-bottom:26px}
.disco.pequeno{width:104px;height:104px;margin-bottom:22px}
.bg-light .disco{box-shadow:0 0 0 1px var(--cream-line)}
.disco img{width:100%;height:100%;object-fit:cover;display:block}

/* ============ A ESPINHA: negação riscada, correção em serifa ============ */
.nega{font-size:14.5px;font-weight:500;line-height:1.4;margin-bottom:18px;
  text-decoration:line-through;text-decoration-thickness:1px}
.bg-light .nega{color:#9A8B7D}
.bg-dark  .nega{color:rgba(239,229,214,.42)}

.diz{font-family:var(--font-display);font-size:33px;font-weight:600;line-height:1.1;letter-spacing:-.4px}
.diz.menor{font-size:29px}
.bg-light .diz{color:var(--brown)}
.bg-dark  .diz{color:var(--cream)}
.diz em{font-style:italic;font-weight:500;color:var(--salmon)}

.body{font-size:14px;font-weight:400;line-height:1.58;margin-top:16px}
.bg-light .body{color:var(--ink)}
.bg-dark  .body{color:rgba(239,229,214,.78)}

/* fio curto entre a correção e o corpo, só para dar respiro medido */
.fio{width:44px;height:1px;margin:18px auto 0;background:var(--cream-line)}
.bg-dark .fio{background:rgba(239,229,214,.3)}
</style>
</head>

/* ---------- chrome do slide (sai dentro do PNG) ---------- */
function bottomBar(index, total, isLight){
  const pct    = ((index + 1) / total) * 100;
  const track  = isLight ? 'rgba(74,58,46,0.16)' : 'rgba(239,229,214,0.18)';
  const fill   = isLight ? 'var(--brown)'        : 'var(--cream)';
  const label  = isLight ? 'rgba(74,58,46,0.45)' : 'rgba(239,229,214,0.5)';
  const handle = isLight ? 'rgba(74,58,46,0.62)' : 'rgba(239,229,214,0.72)';
  return `<div style="position:absolute;bottom:0;left:0;right:0;padding:0 28px 20px;z-index:10;">
    <div class="sans" style="font-size:11px;font-weight:600;letter-spacing:.2px;color:${handle};margin-bottom:9px;">${HANDLE}</div>
    <div style="display:flex;align-items:center;gap:10px;">
      <div style="flex:1;height:3px;background:${track};border-radius:2px;overflow:hidden;">
        <div style="height:100%;width:${pct}%;background:${fill};border-radius:2px;"></div>
      </div>
      <span class="sans" style="font-size:11px;color:${label};font-weight:500;">${index + 1}/${total}</span>
    </div>
  </div>`;
}

function swipeArrow(isLight){
  const bg     = isLight ? 'rgba(74,58,46,0.07)' : 'rgba(239,229,214,0.09)';
  const stroke = isLight ? 'rgba(74,58,46,0.3)'  : 'rgba(239,229,214,0.4)';
  return `<div style="position:absolute;right:0;top:0;bottom:0;width:48px;z-index:9;display:flex;align-items:center;justify-content:center;background:linear-gradient(to right,transparent,${bg});">
    <svg width="24" height="24" viewBox="0 0 24 24" fill="none">
      <path d="M9 6l6 6-6 6" stroke="${stroke}" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
  </div>`;
}

  `},

  // 3 — segunda negação
  { bg:'light', html: `
    <div class="medida">
      <p class="nega sans">Não é mais um curso de técnica.</p>
      <h2 class="diz">Você já sabe fazer.</h2>
      <div class="fio"></div>
      <p class="body sans">O que falta é saber o que fazer com o que você já sabe.</p>
    </div>
  `},

  // 4 — a virada. Sem negação riscada, e o salmão entra pela primeira vez.
  { bg:'dark', html: `
    <div class="medida">
      <h2 class="diz menor">O que você precisa é de um <em>diagnóstico honesto</em>.</h2>
      <div class="fio"></div>
      <p class="body sans">Entender exatamente onde está o gargalo, e o que mudar primeiro pra não continuar colocando esforço no lugar errado.</p>
    </div>
  `},

  // 5 — a chamada. Fecha com o rosto de novo, como parêntese.
  { bg:'light', html: `
    <span class="disco pequeno"><img src="${IMG_DISCO}" alt="Gustavo Ono"></span>
    <div class="medida">
      <h2 class="diz menor">Clique em Saiba mais e responda o quiz.</h2>
      <div class="fio"></div>
      <p class="body sans">Descubra o que está travando seus chocolates artesanais de alcançarem o nível profissional que você merece.</p>
    </div>
  `},

];

/* ---------- render + swipe ---------- */
const track    = document.getElementById('track');
const viewport = document.getElementById('viewport');
const dotsEl   = document.getElementById('dots');
const TOTAL    = SLIDES.length;

track.innerHTML = SLIDES.map((s, i) => {
  const isLight = s.bg === 'light';
  const isLast  = i === TOTAL - 1;
  return `<div class="slide bg-${s.bg}">
    <div class="slide-body">${s.html}</div>
    ${isLast ? '' : swipeArrow(isLight)}
    ${bottomBar(i, TOTAL, isLight)}
  </div>`;
}).join('');

dotsEl.innerHTML = SLIDES.map((_, i) => `<span class="ig-dot${i ? '' : ' on'}"></span>`).join('');
document.getElementById('igCaption').innerHTML =
  `<strong>gustavo_ono</strong> ${LEGENDA}<span class="ts">HÁ 2 HORAS</span>`;

let index = 0, startX = 0, dragX = 0, dragging = false;
const W = () => viewport.clientWidth;
function go(i){
  index = Math.max(0, Math.min(TOTAL - 1, i));
  track.style.transition = 'transform .32s cubic-bezier(.22,.61,.36,1)';
  track.style.transform  = `translateX(${-index * W()}px)`;
  [...dotsEl.children].forEach((d, n) => d.classList.toggle('on', n === index));
}
viewport.addEventListener('pointerdown', e => {
  dragging = true; startX = e.clientX; dragX = 0;
  viewport.classList.add('dragging');
  viewport.setPointerCapture(e.pointerId);
  track.style.transition = 'none';
});
viewport.addEventListener('pointermove', e => {
  if(!dragging) return;
  dragX = e.clientX - startX;
  track.style.transform = `translateX(${-index * W() + dragX}px)`;
});
function endDrag(){
  if(!dragging) return;
  dragging = false;
  viewport.classList.remove('dragging');
  if(Math.abs(dragX) > W() * 0.18) go(index + (dragX < 0 ? 1 : -1));
  else go(index);
}
viewport.addEventListener('pointerup', endDrag);
viewport.addEventListener('pointercancel', endDrag);
document.addEventListener('keydown', e => {
  if(e.key === 'ArrowRight') go(index + 1);
  if(e.key === 'ArrowLeft')  go(index - 1);
});
window.addEventListener('resize', () => go(index));
go(0);
</script>
</body>
