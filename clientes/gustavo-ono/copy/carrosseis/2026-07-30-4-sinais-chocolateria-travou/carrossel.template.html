<!DOCTYPE html>
<!--
  CARROSSEL DE ANÚNCIO — Gustavo Ono (@gustavo_ono)
  Ângulo: "4 sinais de que sua chocolateria travou"
  Copy: fornecida pelo cliente, 6 blocos, um por slide.

  Mesma identidade do carrossel anterior (creme #EFE5D6, cacau #3B2A20,
  marrom #7A5540, salmão #E08A8A, Playfair Display + Plus Jakarta Sans),
  mas com outro sistema de composição, para as duas peças não parecerem
  a mesma coisa no feed:
    - numerais gigantes como espinha da narrativa, no lugar do bloco "Uma / A outra"
    - fotografia sangrando na abertura e recorte no fecho, no lugar de foto emoldurada
    - fio horizontal sob o numeral, no lugar do fio curto de remate
    - salmão com papel de destaque, não só de kicker

  Este é o arquivo que se edita. Rode embutir-imagens.py para gerar o
  carrossel.html autocontido.
-->
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Carrossel Gustavo Ono: 4 sinais</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<style>
:root{
  --cream:      #EFE5D6;
  --cream-line: #DCCDB6;
  --cocoa:      #3B2A20;
  --cocoa-deep: #2A1D16;
  --brown:      #7A5540;
  --brown-soft: #A9866A;
  --salmon:     #E08A8A;
  --ink:        #4A3A2E;

  --font-display: 'Playfair Display', Georgia, serif;
  --font-text:    'Plus Jakarta Sans', system-ui, sans-serif;

  --slide-w: 420px;
  --slide-h: 525px;
}

*{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--font-text);background:#DED3C2;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:32px 16px}
.serif{font-family:var(--font-display)}
.sans {font-family:var(--font-text)}

/* ============ MOLDURA DO INSTAGRAM (só preview) ============ */
.ig-frame{width:420px;max-width:100%;background:#fff;border-radius:12px;box-shadow:0 8px 40px rgba(59,42,32,.22);overflow:hidden}
.ig-header{display:flex;align-items:center;gap:10px;padding:12px 14px}
.ig-avatar{width:34px;height:34px;border-radius:50%;flex:0 0 auto;overflow:hidden;background:var(--cocoa)}
.ig-avatar img{width:210%;height:210%;object-fit:cover;object-position:50% 6%;display:block;margin:-6% 0 0 -55%}
.ig-handle{font-size:13px;font-weight:700;color:#111;line-height:1.2}
.ig-sub{font-size:11px;color:#8A8580;line-height:1.2}
.ig-dots{display:flex;justify-content:center;gap:5px;padding:10px 0 4px}
.ig-dot{width:6px;height:6px;border-radius:50%;background:#D5D5D5;transition:background .2s}
.ig-dot.on{background:var(--brown)}
.ig-actions{display:flex;gap:14px;padding:6px 14px 2px;color:#111}
.ig-actions .spacer{flex:1}
.ig-caption{padding:6px 14px 14px;font-size:13px;line-height:1.45;color:#111}
.ig-caption .ts{display:block;margin-top:8px;font-size:10px;letter-spacing:.4px;color:#9A9A9A}

/* ============ VIEWPORT ============ */
.carousel-viewport{width:100%;aspect-ratio:4/5;overflow:hidden;position:relative;cursor:grab;touch-action:pan-y;user-select:none}
.carousel-viewport.dragging{cursor:grabbing}
.carousel-track{display:flex;height:100%;transition:transform .32s cubic-bezier(.22,.61,.36,1);will-change:transform}

/* ============ SLIDE ============ */
.slide{flex:0 0 var(--slide-w);width:var(--slide-w);height:100%;position:relative;overflow:hidden;display:flex;flex-direction:column;-webkit-font-smoothing:antialiased}
.slide.bg-light{background:var(--cream);color:var(--ink)}
.slide.bg-dark {background:var(--cocoa);color:var(--cream)}
.slide-body{flex:1;display:flex;flex-direction:column;padding:34px 36px 80px;position:relative;z-index:2}
.slide-body.center{justify-content:center}
.slide-body.bottom{justify-content:flex-end}

/* ============ CAMADAS DE IMAGEM ============ */
.bleed{position:absolute;inset:0;z-index:0;background-position:center 12%;background-size:cover}
.veil {position:absolute;inset:0;z-index:1}

/* ============ NUMERAL, A ESPINHA DESTE CARROSSEL ============ */
.num{font-family:var(--font-display);font-size:82px;font-weight:400;line-height:.86;letter-spacing:-2px;display:block}
.bg-light .num{color:var(--brown)}
.bg-dark  .num{color:var(--salmon)}
.num-rule{height:1px;margin:16px 0 20px;background:var(--cream-line)}
.bg-dark .num-rule{background:rgba(239,229,214,.26)}

/* ============ TIPOGRAFIA ============ */
.t-hero{font-family:var(--font-display);font-size:40px;font-weight:600;line-height:1.04;letter-spacing:-.6px;color:var(--cream)}
.t-sig {font-family:var(--font-display);font-size:29px;font-weight:600;line-height:1.1;letter-spacing:-.3px}
.bg-light .t-sig{color:var(--brown)}
.bg-dark  .t-sig{color:var(--cream)}
.body{font-size:14px;font-weight:400;line-height:1.55;margin-top:12px}
.bg-light .body{color:var(--ink)}
.bg-dark  .body{color:rgba(239,229,214,.8)}

.kicker{font-size:10px;font-weight:700;letter-spacing:2.4px;text-transform:uppercase;display:inline-block;margin-bottom:10px}
.bg-light .kicker{color:var(--brown-soft)}
.bg-dark  .kicker{color:var(--salmon)}

/* fala interna da chocolateira, no sinal 2 */
.pensamento{margin-top:14px;padding-left:14px;border-left:2px solid var(--salmon)}
.pensamento p{font-family:var(--font-display);font-size:19px;font-style:italic;line-height:1.3;color:var(--cream)}

/* ============ FECHO COM RECORTE ============ */
.recorte{position:absolute;right:-6px;bottom:64px;width:236px;z-index:1}
.recorte img{display:block;width:100%;height:auto}
/* dissolve a base do recorte no creme, para não ficar corte reto */
.recorte::after{content:'';position:absolute;left:0;right:0;bottom:-10px;height:96px;
  background:linear-gradient(180deg,rgba(239,229,214,0) 0%,rgba(239,229,214,.88) 54%,var(--cream) 78%);}
</style>
</head>
<body>

<div class="ig-frame">
  <div class="ig-header">
    <div class="ig-avatar"><img src="__IMG_RECORTE__" alt=""></div>
    <div>
      <div class="ig-handle">gustavo_ono</div>
      <div class="ig-sub">Patrocinado</div>
    </div>
  </div>

  <div class="carousel-viewport" id="viewport">
    <div class="carousel-track" id="track"></div>
  </div>

  <div class="ig-dots" id="dots"></div>

  <div class="ig-actions">
    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M20.8 4.6a5.5 5.5 0 00-7.8 0L12 5.7l-1-1.1a5.5 5.5 0 00-7.8 7.8l1.1 1.1L12 21.2l7.7-7.7 1.1-1.1a5.5 5.5 0 000-7.8z" stroke-linecap="round" stroke-linejoin="round"/></svg>
    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M21 11.5a8.4 8.4 0 01-9 8.4 8.5 8.5 0 01-3.8-.9L3 20.5l1.5-4.4A8.4 8.4 0 0121 11.5z" stroke-linecap="round" stroke-linejoin="round"/></svg>
    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M22 2L11 13M22 2l-7 20-4-9-9-4 20-7z" stroke-linecap="round" stroke-linejoin="round"/></svg>
    <span class="spacer"></span>
    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M19 21l-7-5-7 5V5a2 2 0 012-2h10a2 2 0 012 2z" stroke-linecap="round" stroke-linejoin="round"/></svg>
  </div>

  <div class="ig-caption" id="igCaption"></div>
</div>

<script>
const HANDLE  = '@gustavo_ono';
const LEGENDA = 'Dá pra estar vendendo e mesmo assim estar travada. São 4 sinais: você não sabe qual produto dá lucro, seu preço tem medo embutido, você produz mais do que vende, e não consegue explicar por que um mês é bom e o outro não. Clique em Saiba mais e faça o diagnóstico gratuito.';

const IMG_HERO    = '__IMG_HERO__';
const IMG_RECORTE = '__IMG_RECORTE__';

/* ---------- chrome do slide (sai dentro do PNG) ---------- */
function bottomBar(index, total, isLight){
  const pct    = ((index + 1) / total) * 100;
  const track  = isLight ? 'rgba(74,58,46,0.14)' : 'rgba(239,229,214,0.18)';
  const fill   = isLight ? 'var(--brown)'        : 'var(--cream)';
  const label  = isLight ? 'rgba(74,58,46,0.45)' : 'rgba(239,229,214,0.5)';
  const handle = isLight ? 'rgba(74,58,46,0.62)' : 'rgba(239,229,214,0.72)';
  return `<div style="position:absolute;bottom:0;left:0;right:0;padding:0 28px 20px;z-index:10;">
    <div class="sans" style="font-size:11px;font-weight:600;letter-spacing:.2px;color:${handle};margin-bottom:9px;">${HANDLE}</div>
    <div style="display:flex;align-items:center;gap:10px;">
      <div style="flex:1;height:3px;background:${track};border-radius:2px;overflow:hidden;">
        <div style="height:100%;width:${pct}%;background:${fill};border-radius:2px;"></div>
      </div>
      <span class="sans" style="font-size:11px;color:${label};font-weight:500;">${index + 1}/${total}</span>
    </div>
  </div>`;
}

function swipeArrow(isLight){
  const bg     = isLight ? 'rgba(74,58,46,0.07)' : 'rgba(239,229,214,0.09)';
  const stroke = isLight ? 'rgba(74,58,46,0.3)'  : 'rgba(239,229,214,0.4)';
  return `<div style="position:absolute;right:0;top:0;bottom:0;width:48px;z-index:9;display:flex;align-items:center;justify-content:center;background:linear-gradient(to right,transparent,${bg});">
    <svg width="24" height="24" viewBox="0 0 24 24" fill="none">
      <path d="M9 6l6 6-6 6" stroke="${stroke}" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
  </div>`;
}

/* foto sangrando no slide inteiro, sob véu de cacau */
function fotoSangrada(){
  return `<div class="bleed" style="background-image:url(${IMG_HERO});"></div>
          <div class="veil" style="background:linear-gradient(180deg,rgba(42,29,22,.38) 0%,rgba(42,29,22,.28) 26%,rgba(42,29,22,.46) 42%,rgba(42,29,22,.78) 55%,rgba(42,29,22,.92) 68%,rgba(42,29,22,.97) 100%);"></div>`;
}

/* cabeça de um slide de sinal: numeral gigante e o fio */
function numeral(n){
  return `<span class="num">${n}</span><div class="num-rule"></div>`;
}

/* ---------- os slides: um bloco da copy do cliente por slide ---------- */
const SLIDES = [

  // 1 — abertura, foto do ateliê sangrando
  { bg:'dark', pos:'bottom', fundo:fotoSangrada, html: `
    <h1 class="t-hero">4 sinais de que<br>sua chocolateria<br>travou</h1>
    <p class="body sans" style="font-size:15px;color:rgba(239,229,214,.82);">mesmo que você ainda esteja vendendo</p>
  `},

  // 2 — sinal 1
  { bg:'light', pos:'bottom', html: `
    ${numeral('01')}
    <span class="kicker sans">Sinal 1</span>
    <h2 class="t-sig">Você não sabe qual produto te dá mais lucro.</h2>
    <p class="body sans">Você tem vários produtos no portfólio. Mas se alguém perguntasse qual deles paga de verdade, e qual te faz trabalhar de graça, você não saberia responder.</p>
  `},

  // 3 — sinal 2
  { bg:'dark', pos:'bottom', html: `
    ${numeral('02')}
    <span class="kicker sans">Sinal 2</span>
    <h2 class="t-sig">Seu preço tem medo embutido.</h2>
    <p class="body sans">Você não calculou o preço, você chutou. E continua com aquela sensação no fundo:</p>
    <div class="pensamento"><p>"cobrei barato demais de novo."</p></div>
  `},

  // 4 — sinal 3
  { bg:'light', pos:'bottom', html: `
    ${numeral('03')}
    <span class="kicker sans">Sinal 3</span>
    <h2 class="t-sig">Você está mais ocupada produzindo do que vendendo.</h2>
    <p class="body sans">Cozinha cheia. Encomendas em dia. Mas sobra zero tempo, e zero energia, pra pensar em como crescer.</p>
  `},

  // 5 — sinal 4
  { bg:'dark', pos:'bottom', html: `
    ${numeral('04')}
    <span class="kicker sans">Sinal 4</span>
    <h2 class="t-sig">Você não consegue explicar por que um mês é bom e outro é ruim.</h2>
    <p class="body sans">Não é o mercado. Não é sorte. É que sem método, o resultado depende de variável que você não controla.</p>
  `},

  // 6 — fecho, com o recorte
  { bg:'light', pos:'top', extra:`<div class="recorte"><img src="${IMG_RECORTE}" alt="Gustavo Ono"></div>`, html: `
    <span class="kicker sans">Próximo passo</span>
    <h2 class="t-sig" style="font-size:31px;max-width:290px;">Se você se identificou com qualquer um desses,</h2>
    <p class="serif" style="font-size:31px;font-style:italic;font-weight:500;color:var(--brown);line-height:1.1;margin-top:6px;max-width:250px;">o diagnóstico gratuito é o próximo passo.</p>
  `},

];

/* ---------- render + swipe ---------- */
const track    = document.getElementById('track');
const viewport = document.getElementById('viewport');
const dotsEl   = document.getElementById('dots');
const TOTAL    = SLIDES.length;

track.innerHTML = SLIDES.map((s, i) => {
  const isLight = s.bg === 'light';
  const isLast  = i === TOTAL - 1;
  return `<div class="slide bg-${s.bg}">
    ${s.fundo ? s.fundo() : ''}
    ${s.extra || ''}
    <div class="slide-body ${s.pos || 'bottom'}">${s.html}</div>
    ${isLast ? '' : swipeArrow(isLight)}
    ${bottomBar(i, TOTAL, isLight)}
  </div>`;
}).join('');

dotsEl.innerHTML = SLIDES.map((_, i) => `<span class="ig-dot${i ? '' : ' on'}"></span>`).join('');
document.getElementById('igCaption').innerHTML =
  `<strong>gustavo_ono</strong> ${LEGENDA}<span class="ts">HÁ 2 HORAS</span>`;

let index = 0, startX = 0, dragX = 0, dragging = false;
const W = () => viewport.clientWidth;
function go(i){
  index = Math.max(0, Math.min(TOTAL - 1, i));
  track.style.transition = 'transform .32s cubic-bezier(.22,.61,.36,1)';
  track.style.transform  = `translateX(${-index * W()}px)`;
  [...dotsEl.children].forEach((d, n) => d.classList.toggle('on', n === index));
}
viewport.addEventListener('pointerdown', e => {
  dragging = true; startX = e.clientX; dragX = 0;
  viewport.classList.add('dragging');
  viewport.setPointerCapture(e.pointerId);
  track.style.transition = 'none';
});
viewport.addEventListener('pointermove', e => {
  if(!dragging) return;
  dragX = e.clientX - startX;
  track.style.transform = `translateX(${-index * W() + dragX}px)`;
});
function endDrag(){
  if(!dragging) return;
  dragging = false;
  viewport.classList.remove('dragging');
  if(Math.abs(dragX) > W() * 0.18) go(index + (dragX < 0 ? 1 : -1));
  else go(index);
}
viewport.addEventListener('pointerup', endDrag);
viewport.addEventListener('pointercancel', endDrag);
document.addEventListener('keydown', e => {
  if(e.key === 'ArrowRight') go(index + 1);
  if(e.key === 'ArrowLeft')  go(index - 1);
});
window.addEventListener('resize', () => go(index));
go(0);
</script>
</body>
</html>
