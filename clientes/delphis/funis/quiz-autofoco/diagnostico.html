  <style>
    .report-head { text-align: center; padding: 20px 0 6px; }
    .report-head .selo { margin-bottom: 12px; }
    .report-head h1 { font-size: 26px; }
    .etapa { margin: 0 0 16px; }
    .etapa h3 { font-size: 12.5px; text-transform: uppercase; letter-spacing: .1em; color: var(--gold); margin: 0 0 8px; }
    .etapa p { margin: 0 0 10px; }
    .depo { background: var(--gold-soft); border: 1px dashed var(--gold-deep); border-radius: var(--radius-sm); padding: 14px; margin: 8px 0; font-size: 14.5px; color: var(--muted); }
    .cta-box { background: var(--gold-soft); border: 1px solid var(--gold-deep); border-radius: var(--radius); padding: 22px; text-align: center; margin-top: 8px; }
    .toolbar { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; margin: 4px 0 22px; }
    .report-head h1 .gold { color: var(--gold); }
    .mirror { margin: 8px 0 12px; padding-left: 18px; color: var(--muted); }
    .mirror li { margin-bottom: 6px; }
    .custo { border-left: 2px solid var(--gold-deep); padding-left: 12px; color: var(--muted); }
    @media print {
      .no-print { display: none !important; }
      body { background: #fff; color: #14161a; }
      .card { box-shadow: none; border-color: #ddd; margin: 0; background: #fff; }
      .card, .etapa p, .mirror, .lead { color: #14161a; }
      .topbar, .foot, .brand .brand-name, .brand .brand-tag { color: #14161a; }
      .etapa h3 { color: #8A6D1F; }
      .depo, .cta-box { background: #FAF6EC; border-color: #D8C08A; color: #14161a; }
      .etapa, .cta-box, .depo { break-inside: avoid; }
