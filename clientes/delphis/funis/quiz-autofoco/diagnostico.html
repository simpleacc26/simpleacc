<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Seu Diagnóstico AUTOFOCO · Delphis Fonseca</title>
  <meta name="theme-color" content="#0A0A0A" />
  <style>
    :root{--bg:#0A0A0A;--text:#F5F0E8}
    body{margin:0;background:var(--bg);color:var(--text);
      font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif}
  </style>

  <link rel="stylesheet" href="styles.css" />
  <style>
    .report-head { text-align: center; padding: 22px 0 14px; }
    .report-head .selo { margin-bottom: 14px; }
    .report-head h1 { font-size: 26px; line-height: 1.28; }
    .report-head h1 .gold { color: var(--gold); }

    /* Respiro entre os blocos da leitura: cada etapa é um trecho fechado, com
       um fio separando do próximo. Vale para telas grandes e para o celular. */
    .etapa { margin: 0 0 38px; }
    .etapa + .etapa { border-top: 1px solid var(--border); padding-top: 34px; }
    .etapa:last-of-type { margin-bottom: 30px; }
    .etapa h3 { font-size: 12.5px; text-transform: uppercase; letter-spacing: .12em; color: var(--gold); margin: 0 0 18px; }
    .etapa p { margin: 0 0 20px; line-height: 1.75; }
    .etapa p:last-child { margin-bottom: 0; }

    /* Cartao do autor, no bloco "Quem conduz". */
    .autor { display: flex; align-items: center; gap: 18px; margin: 0 0 22px; }
    .autor-foto { width: 104px; height: 104px; flex: 0 0 104px; border-radius: 50%; object-fit: cover;
      border: 2px solid var(--gold-deep); box-shadow: 0 6px 18px rgba(0,0,0,.45); }
    .autor-nome strong { display: block; font-family: var(--font-serif); font-size: 21px; line-height: 1.2; }
    .autor-nome span { display: block; margin-top: 6px; color: var(--muted); font-size: 14px; line-height: 1.55; }

    /* Chamadas de WhatsApp distribuídas ao longo da leitura. Discretas de
       propósito: a caixa dourada cheia fica reservada para o fim. */
    .cta-inline { text-align: center; margin: 34px 0 38px; padding: 22px 16px;
      border-top: 1px solid var(--border); border-bottom: 1px solid var(--border); }
    .cta-inline p { margin: 0 0 16px; color: var(--muted); font-size: 15.5px; line-height: 1.65; }
    .cta-inline .btn { padding: 14px 24px; }
    .etapa + .cta-inline { margin-top: 0; border-top: none; padding-top: 0; }

    /* Depoimentos em vídeo. Os clipes são verticais, então os cards ficam numa
       faixa que desliza no dedo em vez de empilhar e esticar a página. */
    .depos-titulo { margin: 26px 0 12px; color: var(--gold); font-size: 12.5px;
      text-transform: uppercase; letter-spacing: .12em; font-weight: 700; }
    .depos { display: grid; grid-auto-flow: column; grid-auto-columns: minmax(164px, 1fr);
      gap: 14px; overflow-x: auto; padding-bottom: 8px;
      scroll-snap-type: x mandatory; -webkit-overflow-scrolling: touch; }
    .depo-card { margin: 0; scroll-snap-align: start; }
    .depo-play { position: relative; display: block; width: 100%; aspect-ratio: 9 / 16;
      padding: 0; background: #000; cursor: pointer; overflow: hidden;
      border: 1px solid var(--border); border-radius: var(--radius-sm);
      transition: border-color .2s, transform .15s; }
    .depo-play:hover { border-color: var(--gold); transform: translateY(-2px); }
    .depo-play:focus-visible { outline: 3px solid var(--ring); outline-offset: 2px; }
    .depo-play img { width: 100%; height: 100%; object-fit: cover; }
    .depo-icone { position: absolute; inset: 0; margin: auto; width: 46px; height: 46px;
      border-radius: 50%; background: rgba(201,168,76,.94); color: #0A0A0A;
      display: grid; place-items: center; font-size: 16px; padding-left: 3px;
      box-shadow: 0 4px 14px rgba(0,0,0,.5); }
    .depo-card figcaption { margin-top: 11px; }
    .depo-card figcaption strong { display: block; font-size: 14.5px; line-height: 1.3; }
    .depo-card figcaption span { display: block; margin-top: 4px; color: var(--muted);
      font-size: 12.5px; line-height: 1.45; }

    /* Player em tela cheia, aberto só no toque. */
    .modal { position: fixed; inset: 0; z-index: 50; background: rgba(8,8,8,.97);
      -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px);
      display: grid; place-items: center; padding: 18px; }
    .modal[hidden] { display: none; }
    .modal-caixa { width: min(360px, 100%); }
    .modal-fechar { display: block; margin: 0 0 8px auto; padding: 2px 8px; background: none;
      border: none; color: var(--text); font-size: 30px; line-height: 1; cursor: pointer; }
    .modal-video { position: relative; aspect-ratio: 9 / 16; background: #000;
      border-radius: var(--radius-sm); overflow: hidden; }
    .modal-video iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; }
    .modal-legenda { margin: 12px 0 0; color: var(--muted); font-size: 13px;
      line-height: 1.55; text-align: center; }
    .cta-box { background: var(--gold-soft); border: 1px solid var(--gold-deep); border-radius: var(--radius); padding: 28px 24px; text-align: center; margin-top: 10px; }
    .cta-box p { line-height: 1.7; margin: 0 0 16px; }
    .toolbar { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; margin: 4px 0 22px; }
    .mirror { margin: 18px 0 22px; padding-left: 20px; color: var(--muted); line-height: 1.7; }
    .mirror li { margin-bottom: 13px; }
    .mirror li:last-child { margin-bottom: 0; }
    .custo { border-left: 2px solid var(--gold-deep); padding: 4px 0 4px 16px; margin-top: 26px; color: var(--muted); line-height: 1.7; }

    @media (max-width: 520px) {
      #report { padding: 26px 20px; }
      .etapa { margin-bottom: 32px; }
      .etapa + .etapa { padding-top: 28px; }
      .etapa p { margin-bottom: 18px; }
      .autor { flex-direction: column; text-align: center; gap: 14px; }
    }
    @media print {
      .no-print { display: none !important; }
      body { background: #fff; color: #14161a; }
      .card { box-shadow: none; border-color: #ddd; margin: 0; background: #fff; }
      .card, .etapa p, .mirror, .lead { color: #14161a; }
      .topbar, .foot, .brand .brand-name, .brand .brand-tag { color: #14161a; }
      .etapa h3 { color: #8A6D1F; }
      .depo, .cta-box { background: #FAF6EC; border-color: #D8C08A; color: #14161a; }
      .etapa, .cta-box, .depo { break-inside: avoid; }
      .etapa { margin-bottom: 24px; }
      .etapa + .etapa { border-top-color: #E2DDD2; padding-top: 22px; }
      .autor-foto { border-color: #C7A651; box-shadow: none; }
      .depos { display: block; overflow: visible; }
      .depo-play { display: none; }
      .depo-card { margin-bottom: 10px; break-inside: avoid; }
      .depo-card figcaption strong, .depo-card figcaption span { color: #14161a; }
    }
  </style>
</head>
<body>
  <header class="topbar">
    <div class="container">
      <div class="brand">
        <span class="brand-name">Aut<span class="alvo" aria-hidden="true"><svg viewBox="0 0 40 40" role="img" aria-label="o"><circle cx="20" cy="20" r="17" fill="none" stroke="currentColor" stroke-width="4"/><circle cx="20" cy="20" r="9" fill="none" stroke="currentColor" stroke-width="3"/><circle cx="20" cy="20" r="3.2" fill="currentColor"/></svg></span>foco</span>
        <span class="brand-tag">Comunicação de Verdade</span>
      </div>
    </div>
  </header>

  <main class="container">
    <div class="toolbar no-print">
      <button class="btn btn-primary zap" id="whatsapp" type="button">Falar com o Delphis no WhatsApp</button>
      <button class="btn btn-ghost" id="pdf">Baixar PDF</button>
    </div>
    <div class="card screen" id="report"></div>
  </main>

  <div class="modal no-print" id="video" hidden>
    <div class="modal-caixa" role="dialog" aria-modal="true" aria-label="Depoimento em vídeo">
      <button class="modal-fechar" id="video-fechar" type="button" aria-label="Fechar o vídeo">&times;</button>
      <div class="modal-video">
        <iframe id="video-frame" title="Depoimento em vídeo" allow="autoplay; fullscreen" allowfullscreen></iframe>
      </div>
      <p class="modal-legenda" id="video-legenda"></p>
    </div>
  </div>

  <p class="foot">Diagnóstico AUTOFOCO · Delphis Fonseca · leitura pessoal, feita a partir das suas respostas</p>

  <script src="flow.js" defer></script>
  <script src="diagnostico.js" defer></script>
</body>
</html>
