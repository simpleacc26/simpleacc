<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Seu diagnóstico · GES360</title>
  <meta name="robots" content="noindex" />
  <style>
    :root{--bg:#001824;--text:#EEF3F5}
    body{margin:0;background:var(--bg);color:var(--text);
      font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif}
  </style>
  <link rel="stylesheet" href="styles.css" />
  <style>
    /* --- específico do relatório --- */
    .report-head { text-align: center; padding: 16px 0 6px; }
    .report-head .selo { margin-bottom: 12px; }
    .report-head h1 { font-size: 26px; }
    .etapa { margin: 0 0 18px; }
    .etapa h3 { font-size: 13px; text-transform: uppercase; letter-spacing: .08em; color: var(--gold-light); margin: 0 0 8px; }
    .etapa p { margin: 0 0 10px; }
    .compare { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin: 8px 0; }
    .compare .col { border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 14px; background: var(--bg-2); }
    .compare .col h4 { margin: 0 0 8px; font-size: 14px; }
    .compare .col.bad h4 { color: #E0645A; }
    .compare .col.good { background: #0C2F26; border-color: #1E6B36; }
    .compare .col.good h4 { color: #57C878; }
    .compare ul { margin: 0; padding-left: 18px; font-size: 15px; color: var(--muted); }
    .compare .good ul { color: var(--text); }
    .depo { background: var(--gold-soft); border-left: 3px solid var(--gold); border-radius: var(--radius-sm);
            padding: 14px; margin: 8px 0; font-size: 15px; color: var(--text); }
    /* prints de WhatsApp: fundo claro, então o cartão em volta precisa de moldura */
    .depo-shot { margin: 16px 0 18px; }
    .depo-shot img { width: 100%; height: auto; display: block; border-radius: var(--radius-sm);
                     border: 1px solid var(--border-ui); background: #ECE5DD; }
    .depo-shot figcaption { font-size: 14px; line-height: 1.45; color: var(--muted);
                            margin-top: 9px; padding-left: 11px; border-left: 3px solid var(--gold); }
    /* citação: fala literal, com atribuição e data. Não imita um print. */
    .depo-quote { margin: 18px 0 6px; padding: 16px 18px; background: var(--gold-soft);
                  border: 1px solid var(--border); border-left: 3px solid var(--gold);
                  border-radius: var(--radius-sm); }
    .depo-quote p { margin: 0; font-size: 16px; line-height: 1.5; color: var(--text); }
    .depo-quote p::before { content: "“"; }
    .depo-quote p::after  { content: "”"; }
    .depo-quote cite { display: block; margin-top: 10px; font-style: normal; font-size: 13px;
                       letter-spacing: .02em; color: var(--gold-light); }
    .cta-box { background: linear-gradient(160deg,#0C2F3E,#0A2331); border: 1px solid var(--border);
               border-radius: var(--radius); padding: 24px; text-align: center; margin-top: 10px; }
    .clube { font-size: 15px; color: var(--muted); margin-top: 14px; }
    /* CTA distribuído: aparece 3 vezes ao longo do relatório, não só no fim */
    .cta-inline { text-align: center; margin: 22px 0; }
    .cta-inline .btn { width: 100%; max-width: 420px; }
    /* método GES360 */
    .metodo { margin: 0; padding-left: 18px; }
    .metodo li { margin: 0 0 8px; }
    .metodo strong { color: var(--gold-light); }
    /* bloco de autoridade (Quem é o Guilherme) */
    .autor { display: flex; align-items: center; gap: 15px; margin: 2px 0 14px; }
    .autor-foto { width: 92px; height: 92px; flex: 0 0 92px; border-radius: 50%; object-fit: cover; border: 2px solid var(--gold); }
    .autor-nome { display: block; font-family: var(--font-serif); font-size: 19px; font-weight: 700; letter-spacing: .05em; color: var(--gold-light); line-height: 1.15; }
    .autor-cargo { display: block; font-size: 11px; letter-spacing: .16em; text-transform: uppercase; color: var(--muted); margin-top: 5px; }
    .cred-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin: 12px 0 6px; }
    .cred { border: 1px solid var(--border); border-radius: var(--radius-sm); background: var(--gold-soft); padding: 13px 14px; }
    .cred .n { font-family: var(--font-serif); font-size: 21px; font-weight: 700; color: var(--gold-light); line-height: 1.05; }
    .cred .d { font-size: 12.5px; color: var(--muted); margin-top: 3px; }
    .cred.full { grid-column: 1 / -1; }
    @media (max-width: 520px){ .cred-grid { grid-template-columns: 1fr; } }
    @media (max-width: 520px){ .compare { grid-template-columns: 1fr; } }
    @media print {
      .no-print { display: none !important; }
      .compare .col, .cta-box, .depo { break-inside: avoid; background: #fff !important; }
      .etapa { break-inside: avoid; }
      .etapa h3 { color: #8C6E1C !important; }
    }
  </style>
</head>
<body>
  <header class="topbar">
    <div class="container">
      <div class="brand">
        <img class="logo-img" src="logo.png" alt="GES360 Implementação" />
      </div>
    </div>
  </header>

  <main class="container">
    <!-- Sem barra de "Baixar PDF" no topo: a ação vem dos CTAs distribuídos
         dentro do relatório (mesmo padrão do quiz da Pâmella e do Felipe). -->
    <div class="card screen" id="report"><!-- preenchido por diagnostico.js --></div>
  </main>

  <p class="foot">Diagnóstico elaborado com base nas suas respostas · GES360 · Guilherme Eduardo</p>

  <script src="flow.js" defer></script>
  <script src="diagnostico.js" defer></script>
</body>
</html>
